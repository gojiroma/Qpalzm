<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">

<meta name="mobile-web-app-capable" content="yes">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #cal {
    position: fixed; right: 20px; top: 16px; margin: 0; pointer-events: none; width: 190px;
    color: #00ff66; font: 12px/1.5 "SF Mono", Menlo, Consolas, monospace; letter-spacing: .06em;
    text-shadow: 0 0 6px rgba(0, 255, 102, .6); user-select: none; opacity: 0; font-variant-numeric: tabular-nums; transition: opacity 1.2s;
  }
  #cal.on { opacity: 1; }
  #cal .row { display: flex; justify-content: space-between; }
  #cal .gap { height: 8px; }
  #cal .bar { height: 7px; border: 1px solid #00ff66; margin: 1px 0 5px; }
  #cal .bar i { display: block; height: 100%; background: rgba(0, 255, 102, .75); box-shadow: 0 0 6px rgba(0, 255, 102, .7); }
  @media (max-width: 640px) { #cal { top: auto; bottom: 14px; right: auto; left: 20px; width: 170px; } }
  #fx {
    position: fixed; right: 20px; bottom: 14px; width: 170px; pointer-events: none; opacity: 0; transition: opacity 1.2s;
    color: #00ff66; font: 12px/1.5 "SF Mono", Menlo, Consolas, monospace; letter-spacing: .06em; text-align: right; white-space: nowrap;
    text-shadow: 0 0 6px rgba(0, 255, 102, .6); user-select: none; font-variant-numeric: tabular-nums;
  }
  #fx.on { opacity: 1; }
  #fx .big { font-size: 22px; line-height: 1.2; }
  #fx .dn { color: #ff6a4f; text-shadow: 0 0 6px rgba(255, 106, 79, .6); }
  #fx .dim { opacity: .55; }
  #fx svg { display: block; width: 100%; height: 46px; margin-top: 4px; overflow: visible; }
  @media (max-width: 640px) { #fx { width: 140px; right: 14px; } #cal { left: 14px; } }
  #qr {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); opacity: 0; transition: opacity 1.2s; pointer-events: none;
    color: #00ff66; font: 14px/1.5 "SF Mono", Menlo, Consolas, monospace; letter-spacing: .12em; text-align: center;
    text-shadow: 0 0 6px rgba(0, 255, 102, .6); user-select: none;
  }
  #qr.on { opacity: 1; }
  #qr canvas { display: block; margin: 8px auto; box-shadow: 0 0 24px rgba(0, 255, 102, .45); }
  #qr a { color: inherit; pointer-events: auto; display: block; max-width: 80vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #qr .dim { opacity: .55; }
  #cam {
    position: fixed; left: 14px; bottom: 8px; width: 44px; height: 44px; padding: 6px; border: 0; background: none; cursor: pointer;
    color: #00ff66; filter: drop-shadow(0 0 4px rgba(0, 255, 102, .7)); opacity: .8; transition: opacity .2s;
  }
  #cam:hover, #cam:focus-visible { opacity: 1; outline: none; }
  #cam svg { display: block; width: 100%; height: 100%; }
  @media (max-width: 640px) { #cam { bottom: auto; top: 8px; left: auto; right: 8px; } }
  #reader {
    position: fixed; inset: 0; z-index: 10; background: rgba(0, 0, 0, .94); overflow: auto;
    display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 56px 16px 24px; box-sizing: border-box;
    color: #00ff66; font: 13px/1.5 "SF Mono", Menlo, Consolas, monospace; letter-spacing: .06em; text-shadow: 0 0 6px rgba(0, 255, 102, .6);
  }
  #reader[hidden] { display: none; }
  #reader video { width: 640px; max-width: 100%; max-height: 60vh; background: #031; border: 1px solid #00ff66; box-shadow: 0 0 12px rgba(0, 255, 102, .35); }
  #reader ul { width: 640px; max-width: 100%; margin: 0; padding: 0; list-style: none; }
  #reader li { padding: 6px 0; border-bottom: 1px solid rgba(0, 255, 102, .25); overflow-wrap: anywhere; }
  #reader li .dim { opacity: .55; }
  #reader a { color: inherit; }
  #reader .x { position: absolute; top: 8px; right: 8px; width: 44px; height: 44px; border: 0; background: none; color: inherit; font: 28px/1 monospace; cursor: pointer; text-shadow: inherit; }
  #term {
    position: fixed; left: 20px; top: 16px; margin: 0; pointer-events: none;
    color: #00ff66; font: 16px/1.5 "SF Mono", Menlo, Consolas, monospace; letter-spacing: .08em;
    text-shadow: 0 0 6px rgba(0, 255, 102, .7); white-space: pre; user-select: none;
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<pre id="term"></pre>
<div id="cal"></div>
<div id="fx"></div>
<div id="qr"><div class="dim">SCAN TO SEND</div><canvas></canvas><div id="qr-in"></div></div>
<button id="cam" type="button" aria-label="Read a QR code" title="Read a QR code"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M3 8h3.5l1.8-2.5h7.4L17.5 8H21v11H3z"/><circle cx="12" cy="13" r="3.6"/><path d="M18.5 10.5h.01"/></svg></button>
<div id="reader" hidden><button class="x" type="button" aria-label="Close">&times;</button><video playsinline muted></video><ul></ul></div>
<script>
(() => {
  const canvas = document.getElementById("gl");
  const gl = canvas.getContext("webgl", { antialias: true, alpha: false, powerPreference: "high-performance" });

  const VS_Q = `attribute vec2 p; varying vec2 uv; void main(){ uv = p * .5 + .5; gl_Position = vec4(p, 0., 1.); }`;
  const FS_Q = `precision mediump float; varying vec2 uv; uniform sampler2D t; uniform float g;
    void main(){ gl_FragColor = vec4(texture2D(t, uv).rgb * g, 1.0); }`;
  function prog(vs, fs) {
    const mk = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); return o; };
    const p = gl.createProgram();
    gl.attachShader(p, mk(gl.VERTEX_SHADER, vs)); gl.attachShader(p, mk(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(p));
    const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) { const nm = gl.getActiveUniform(p, i).name.replace("[0]", ""); u[nm] = gl.getUniformLocation(p, nm); }
    return { p, u };
  }
  // glow target (low-res; linear upsampling = free blur)
  const GS = 3;
  const gTex = gl.createTexture(), gFbo = gl.createFramebuffer();
  let gw = 0, gh = 0;

  let W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    gw = Math.max(1, Math.round(canvas.width / GS)); gh = Math.max(1, Math.round(canvas.height / GS));
    gl.bindTexture(gl.TEXTURE_2D, gTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gw, gh, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.bindFramebuffer(gl.FRAMEBUFFER, gFbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, gTex, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    wake();
  }
  addEventListener("resize", resize);

  // ---- state ----
  const start = performance.now() + 150;   // intro fade-in of the motif
  // ---- weather sky (Open-Meteo, Tokyo): sun/moon on an arc, clouds, rain, snow, fog, lightning ----
  const PARAMS = new URLSearchParams(location.search);       // ?wx=rain|snow|clear|cloudy|fog|thunder  &at=21.5 (JST hour) for demos
  const WX_URL = "https://api.open-meteo.com/v1/forecast?latitude=35.6895&longitude=139.6917" +
    "&current=temperature_2m,weather_code,cloud_cover&daily=sunrise,sunset&timezone=Asia%2FTokyo&forecast_days=2";
  const clockOffset = PARAMS.has("at") ? (() => {
    const j = new Date(Date.now() + 9 * 3600e3), cur = j.getUTCHours() + j.getUTCMinutes() / 60;
    return ((+PARAMS.get("at") - cur) * 3600e3) || 0;
  })() : 0;
  const nowMs = () => Date.now() + clockOffset;
  const jst = s => Date.parse(s + ":00+09:00");
  function classify(code, cloudPct) {
    let kind = "clear", inten = 0, label = "CLEAR";
    if (code === 1) label = "MOSTLY CLEAR"; else if (code === 2) label = "PARTLY CLOUDY"; else if (code === 3) label = "OVERCAST";
    else if (code === 45 || code === 48) { kind = "fog"; label = "FOG"; }
    else if (code >= 51 && code <= 57) { kind = "rain"; inten = .25; label = "DRIZZLE"; }
    else if (code >= 61 && code <= 67) { kind = "rain"; inten = code >= 65 ? 1 : .6; label = code >= 65 ? "HEAVY RAIN" : "RAIN"; }
    else if (code >= 80 && code <= 82) { kind = "rain"; inten = code === 82 ? 1 : .7; label = "SHOWERS"; }
    else if ((code >= 71 && code <= 77) || code === 85 || code === 86) { kind = "snow"; inten = code === 75 || code === 86 ? 1 : .5; label = "SNOW"; }
    else if (code >= 95) { kind = "thunder"; inten = 1; label = "THUNDERSTORM"; }
    let cloud = cloudPct / 100;
    if (kind !== "clear" && kind !== "fog") cloud = Math.max(cloud, .7);
    return { kind, inten, cloud, label };
  }
  let wx = null, wxAt = 0;
  async function loadWx() {
    try {
      let d;
      if (PARAMS.has("wx")) {
        const day = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10), nd = new Date(Date.now() + 33 * 3600e3).toISOString().slice(0, 10);
        const m = { clear: [0, 5], cloudy: [3, 90], fog: [45, 60], rain: [63, 100], snow: [73, 100], thunder: [95, 100] }[PARAMS.get("wx")] || [0, 5];
        d = { current: { temperature_2m: 18.4, weather_code: m[0], cloud_cover: m[1] },
              daily: { sunrise: [day + "T06:00", nd + "T06:00"], sunset: [day + "T17:00", nd + "T17:00"] } };
      } else {
        const r = await fetch(WX_URL); if (!r.ok) throw 0; d = await r.json();
      }
      wx = Object.assign(classify(d.current.weather_code, d.current.cloud_cover), {
        temp: d.current.temperature_2m,
        riseS: d.daily.sunrise[0].slice(11, 16), setS: d.daily.sunset[0].slice(11, 16),
        rise: jst(d.daily.sunrise[0]), set: jst(d.daily.sunset[0]), nextRise: jst(d.daily.sunrise[1]),
      });
      wxAt = performance.now(); wake();
    } catch {}
  }
  const wxReady = loadWx();
  setInterval(loadWx, 15 * 60e3);

  const pSky = prog(`attribute vec3 s_p; uniform vec2 u_res; varying float v_a;
    void main() { gl_Position = vec4(s_p.x / u_res.x * 2. - 1., 1. - s_p.y / u_res.y * 2., 0., 1.); v_a = s_p.z; }`,
    `precision mediump float; varying float v_a; uniform float u_glow;
    void main() { vec3 c = vec3(0., 1., .4); gl_FragColor = u_glow > .5 ? vec4(c * v_a, 1.) : vec4(c, v_a); }`);
  const bSky = gl.createBuffer();
  let skyN = 0, rain = [], snow = [], bolt = null, boltAt = 0, flash = 0, lastSky = 0;
  const frac = x => x - Math.floor(x);
  // ---- monthly motif (wireframe, centerpiece). ?m=1..12 previews a month ----
  function drawMotif(month, cx, cy, S, t, poly, arc) {
    const TAU = Math.PI * 2, frac1 = x => x - Math.floor(x);
    const P = (x, y) => [cx + x * S, cy + y * S];
    const L = (pts, a, close) => poly(pts.map(p => P(p[0], p[1])), a == null ? .7 : a, close);
    const E = (x, y, rx, ry, a, rot, n) => {
      const o = [], c = Math.cos(rot || 0), s = Math.sin(rot || 0);
      for (let i = 0; i < (n || 28); i++) { const q = i / (n || 28) * TAU, px = Math.cos(q) * rx, py = Math.sin(q) * ry; o.push([x + px * c - py * s, y + px * s + py * c]); }
      L(o, a, true);
    };
    const C = (x, y, r, a) => E(x, y, r, r, a, 0, 24);
    const rotP = (pts, x, y, s, rot) => pts.map(p => [x + (p[0] * Math.cos(rot) - p[1] * Math.sin(rot)) * s, y + (p[0] * Math.sin(rot) + p[1] * Math.cos(rot)) * s]);
    const petal = (x, y, s, rot, a) => L(rotP([[0, -1], [.6, -.45], [.4, .9], [0, .55], [-.4, .9], [-.6, -.45]], x, y, s, rot), a, true);
    const star = (x, y, r, rot, a, k) => { const o = []; for (let i = 0; i < 2 * k; i++) { const q = i * Math.PI / k + rot, rr = i % 2 ? r * .45 : r; o.push([x + Math.cos(q) * rr, y + Math.sin(q) * rr]); } L(o, a, true); };
    const cross = (x, y, z, a) => { L([[x - z, y], [x + z, y]], a); L([[x, y - z], [x, y + z]], a); };
    const flower = (x, y, s, rot) => { for (let i = 0; i < 5; i++) { const q = i * TAU / 5 + rot; C(x + Math.cos(q) * s * .55, y + Math.sin(q) * s * .55, s * .38, .7); } C(x, y, s * .14, .8); for (let i = 0; i < 5; i++) { const q = i * TAU / 5 + rot + .3; L([[x, y], [x + Math.cos(q) * s * .3, y + Math.sin(q) * s * .3]], .6); } };
    const snow = (n, sp) => { for (let i = 0; i < n; i++) { const x = (frac1(i * .618) * 2.8 - 1.4) + Math.sin(t * .8 + i) * .06, y = frac1(t * sp + i * .137) * 2.4 - 1.2; cross(x, y, .035, .55); } };
    switch (month) {
      case 1: // Mt. Fuji + first sunrise
        L([[-1.3, .75], [-.45, -.35], [-.28, -.5], [.28, -.5], [.45, -.35], [1.3, .75]]);
        L([[-.45, -.35], [-.3, -.18], [-.15, -.32], [0, -.12], [.15, -.32], [.3, -.18], [.45, -.35]], .6);
        L([[-1.5, .75], [1.5, .75]], .5); C(.1, -.95, .16, .8);
        for (let i = 0; i < 8; i++) { const q = i * TAU / 8 + t * .1; L([[.1 + Math.cos(q) * .24, -.95 + Math.sin(q) * .24], [.1 + Math.cos(q) * .36, -.95 + Math.sin(q) * .36]], .5); }
        L([[-1.1, -.2], [-.6, -.2]], .4); L([[.7, .05], [1.2, .05]], .4); break;
      case 2: // plum blossoms
        L([[-1.4, .9], [-.8, .5], [-.3, .3], [.2, -.1], [.8, -.35]], .55); L([[-.3, .3], [-.5, -.1], [-.4, -.5]], .45);
        flower(-.4, -.5, .38, .2); flower(.45, -.1, .3, .9); flower(-.05, .15, .22, 1.7); flower(.85, -.4, .2, .4); break;
      case 3: // hishimochi (diamond rice cakes) + peach petals
        [[-.62, .5], [.0, .55], [.62, .6]].forEach(([d, y, w], k) => { const yy = [.5, 0, -.5][k], ww = [.75, .75, .75][k]; L([[0, yy - .32], [ww, yy], [0, yy + .32], [-ww, yy]], .7, true); });
        L([[-.75, -.2], [0, .15]], .0); for (let i = 0; i < 6; i++) petal(-1.1 + (i % 3) * .08, -.6 + i * .25 + Math.sin(t + i) * .03, .06, t * .5 + i, .5); break;
      case 4: // cherry blossoms + falling petals
        flower(-.5, -.3, .5, t * .05); flower(.55, .1, .36, 1 + t * .04);
        for (let i = 0; i < 22; i++) petal(frac1(i * .381) * 2.8 - 1.4 + Math.sin(t * .7 + i) * .12, frac1(t * .07 + i * .137) * 2.4 - 1.2, .06, t * 1.2 + i, .6); break;
      case 5: // carp streamers
        L([[-1.1, -1], [-1.1, 1]], .6); C(-1.1, -1.06, .06, .8);
        [[-.25, 1], [.5, .7]].forEach(([oy, sc], k) => {
          const top = [], bot = [], n = 12;
          for (let i = 0; i <= n; i++) { const u = i / n, x = -1.0 + 1.15 * u * sc, w = .26 * sc * (1 - .6 * u), yc = oy + Math.sin(t * 2.2 - u * 3 + k) * .09 * u; top.push([x, yc - w]); bot.push([x, yc + w]); if (i % 3 === 1) L([[x, yc - w], [x, yc + w]], .3); }
          L(top); L(bot); L([top[0], bot[0]], .6);
          const a = top[n], b = bot[n]; L([a, [a[0] + .25 * sc, a[1] - .12 * sc], [b[0] + .25 * sc, b[1] + .12 * sc], b], .65);
          C(top[1][0] + .02, oy - .03 * sc + Math.sin(t * 2.2 + k) * .003, .025 * sc, .8); L([[-1.1, -.9], top[0]], .35);
        }); break;
      case 6: { // umbrella in the rain
        const ox = 0, oy = -.1, n = 20;
        const top = []; for (let i = 0; i <= n; i++) { const q = Math.PI + (i / n) * Math.PI; top.push([ox + Math.cos(q) * .95, oy + Math.sin(q) * .75]); }
        L(top); for (let i = 0; i < 5; i++) { const a = top[i * 4], b = top[(i + 1) * 4]; const m = [(a[0] + b[0]) / 2, a[1] + .12]; L([a, m, b], .6); }
        for (let i = 1; i < 5; i++) L([[ox, oy - .75], top[i * 4]], .4);
        L([[ox, oy - .75], [ox, .8], [ox - .08, .92], [ox - .22, .9]], .65);
        for (let i = 0; i < 16; i++) { const x = frac1(i * .618) * 2.8 - 1.4, y = frac1(t * .9 + i * .137) * 2.4 - 1.2; L([[x, y], [x - .02, y + .1]], .45); } break; }
      case 7: // tanabata: bamboo, tanzaku, stars
        L([[.1, 1.1], [.15, -1.1]], .6); for (let i = 0; i < 5; i++) L([[.09 + i * .005, .8 - i * .45], [.17 + i * .005, .8 - i * .45]], .4);
        for (let i = 0; i < 6; i++) { const y = -1 + i * .35, d = i % 2 ? 1 : -1; L([[.14, y], [.14 + d * (.5 + (i % 3) * .1), y - .22 + Math.sin(t * 1.2 + i) * .02]], .35); }
        [[-.35, -.1, 0], [.5, .25, 1], [-.6, .4, 2], [.65, -.5, 3]].forEach(([x, y, k]) => { const s = Math.sin(t * 1.1 + k) * .06; const pts = rotP([[-.07, 0], [.07, 0], [.07, .4], [-.07, .4]], x, y, 1, s); L(pts, .65, true); L([[x, y - .22], [x, y]], .4); });
        star(-1, -.7, .1, t * .2, .75, 4); star(1, -.5, .1, -t * .2, .75, 4);
        for (let i = 0; i < 16; i++) { const k = i / 15; cross(-1 + 2 * k, -.7 + .2 * k + Math.sin(k * 6) * .08, .02, .35 + .25 * Math.sin(t * 2 + i)); } break;
      case 8: // fireworks
        [[-.8, -.3, 0], [.05, -.65, .33], [.85, -.15, .66]].forEach(([x, y, off]) => {
          const ph = frac1(t * .22 + off), r = ph * .75, a = Math.max(0, 1 - ph) * .9;
          for (let i = 0; i < 18; i++) { const q = i * TAU / 18 + off; L([[x + Math.cos(q) * r * .7, y + Math.sin(q) * r * .7], [x + Math.cos(q) * r, y + Math.sin(q) * r]], a); }
          if (ph > .2) for (let i = 0; i < 9; i++) { const q = i * TAU / 9 + .3, r2 = r * .45; cross(x + Math.cos(q) * r2, y + Math.sin(q) * r2 + ph * .15, .025, a * .8); }
          if (ph < .15) L([[x, 1.1], [x, y + (1.1 - y) * (1 - ph / .15)]], .6);
        }); break;
      case 9: { // moon rabbit pounding mochi
        C(0, -.1, .9, .75); E(-.35, -.35, .1, .06, .25, 0, 14); E(.4, .15, .14, .08, .2, 0, 14);
        const hop = Math.sin(t * 3) * .06;
        E(.12, -.18, .24, .17, .75, -.3); E(.34, -.4 + hop * .3, .11, .1, .75, 0);
        E(.3, -.66, .045, .2, .75, -.25, 14); E(.42, -.64, .045, .2, .75, .2, 14); C(.38, -.42, .016, .9);
        L([[-.28, .05], [-.2, .22], [.1, .22], [.18, .05]], .75, true); L([[-.3, .05], [.2, .05]], .7);
        const sw = Math.sin(t * 3) * .5; L([[.28, -.25], [.28 - Math.sin(sw) * .4, -.25 - Math.cos(sw) * .4 - .2]], .75); E(.28 - Math.sin(sw) * .4, -.25 - Math.cos(sw) * .4 - .2, .07, .04, .7, sw, 10);
        for (let k = 0; k < 6; k++) { const x = -1.3 + k * .14, h = .75 + (k % 3) * .12, sway = Math.sin(t * .9 + k) * .05; L([[x, 1.1], [x + .05 + sway * .5, 1.1 - h * .55], [x + .1 + sway, 1.1 - h]], .5); for (let j = 0; j < 4; j++) L([[x + .1 + sway, 1.1 - h + j * .05], [x + .16 + sway, 1.1 - h + j * .05 - .06]], .4); } break; }
      case 10: { // Halloween: jack-o'-lantern + bats
        const f = .75 + .25 * Math.abs(Math.sin(t * 5.3) * Math.sin(t * 2.1));

      const na = (ver / 7 | 0) + 2, step = Math.ceil((ver * 4 + 4) / (na * 2 - 2)) * 2, pos = [6];
      for (let p = N - 7; pos.length < na; p -= step) pos.splice(1, 0, p);
      for (const ay of pos) for (const ax of pos) {
        if ((ax === 6 && ay === 6) || (ax === 6 && ay === N - 7) || (ax === N - 7 && ay === 6)) continue;
        for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) set(ax + dx, ay + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
      }
    }
    const format = mask => {
      const v = mask;                              // ECC M = 00
      let r = v; for (let i = 0; i < 10; i++) r = (r << 1) ^ ((r >>> 9) * 0x537);
      const b = ((v << 10) | r) ^ 0x5412, bit = i => ((b >>> i) & 1) === 1;
      for (let i = 0; i <= 5; i++) set(8, i, bit(i));
      set(8, 7, bit(6)); set(8, 8, bit(7)); set(7, 8, bit(8));
      for (let i = 9; i < 15; i++) set(14 - i, 8, bit(i));
      for (let i = 0; i < 8; i++) set(N - 1 - i, 8, bit(i));
      for (let i = 8; i < 15; i++) set(8, N - 15 + i, bit(i));
      set(8, N - 8, true);
    };
    format(0);
    if (ver >= 7) {
      let r = ver; for (let i = 0; i < 12; i++) r = (r << 1) ^ ((r >>> 11) * 0x1F25);
      const b = (ver << 12) | r;
      for (let i = 0; i < 18; i++) { const d = ((b >>> i) & 1) === 1, a = N - 11 + i % 3, c = i / 3 | 0; set(a, c, d); set(c, a, d); }
    }
    // data, zigzag from bottom-right
    let k = 0;
    for (let right = N - 1; right >= 1; right -= 2) {
      if (right === 6) right = 5;
      for (let v = 0; v < N; v++) for (let j = 0; j < 2; j++) {
        const x = right - j, y = ((right + 1) & 2) === 0 ? N - 1 - v : v;
        if (!fn[y][x] && k < out.length * 8) { mod[y][x] = ((out[k >>> 3] >>> (7 - (k & 7))) & 1) === 1; k++; }
      }
    }
    // pick the mask with the lowest penalty
    const masks = [(x, y) => (x + y) % 2, (x, y) => y % 2, (x, y) => x % 3, (x, y) => (x + y) % 3,
      (x, y) => ((x / 3 | 0) + (y / 2 | 0)) % 2, (x, y) => x * y % 2 + x * y % 3,
      (x, y) => (x * y % 2 + x * y % 3) % 2, (x, y) => ((x + y) % 2 + x * y % 3) % 2];
    const apply = m => { for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (!fn[y][x] && masks[m](x, y) === 0) mod[y][x] = !mod[y][x]; };
    const penalty = () => {
      let p = 0, dark = 0;
      const lines = [];
      for (let i = 0; i < N; i++) { lines.push(mod[i]); lines.push(mod.map(r => r[i])); }
      for (const ln of lines) {
        for (let i = 0, run = 1; i < N; i++, run++) if (i === N - 1 || ln[i] !== ln[i + 1]) { if (run >= 5) p += run - 2; run = 0; }
        const s = "0000" + ln.map(Number).join("") + "0000";
        p += 40 * ((s.match(/(?=00001011101|10111010000)/g) || []).length);
      }
      for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
        dark += mod[y][x];
        if (x < N - 1 && y < N - 1 && mod[y][x] === mod[y][x + 1] && mod[y][x] === mod[y + 1][x] && mod[y][x] === mod[y + 1][x + 1]) p += 3;
      }
      return p + 10 * Math.max(0, Math.ceil(Math.abs(dark * 20 - N * N * 10) / (N * N)) - 1);
    };
    let best = 0, bestP = Infinity;
    for (let m = 0; m < 8; m++) { apply(m); format(m); const p = penalty(); if (p < bestP) { bestP = p; best = m; } apply(m); }
    apply(best); format(best);
    return mod;
  }

  // ---- QR inbox (was reqr): scan with a phone, the URL it has copied opens here. Needs api/qr (Vercel + Neon) ----
  const qrEl = document.getElementById("qr"), qrCv = qrEl.querySelector("canvas"), qrIn = document.getElementById("qr-in");
  let room = null, qrBusy = false, qrShown = "", qrDone = false;
  try { room = localStorage.getItem("qr-room"); } catch {}
  function qrDraw() {
    const text = new URL("scan.html#" + room, location.href).href;
    if (qrShown === text) return;
    const m = qrMatrix(text); if (!m) return;
    const n = m.length + 8, s = Math.max(2, Math.floor(Math.min(innerWidth * .8, innerHeight * .6) / n)), r = Math.min(window.devicePixelRatio || 1, 2);
    qrCv.width = qrCv.height = n * s * r; qrCv.style.width = qrCv.style.height = n * s + "px";
    const c = qrCv.getContext("2d");
    c.fillStyle = "#00ff66"; c.fillRect(0, 0, qrCv.width, qrCv.height);
    c.fillStyle = "#000";
    m.forEach((row, y) => row.forEach((d, x) => d && c.fillRect((x + 4) * s * r, (y + 4) * s * r, s * r, s * r)));
    qrShown = text; qrEl.classList.add("on");
  }
  function qrOpen(url) {
    if (!/^https?:\/\//i.test(url)) return;
    const a = document.createElement("a");
    a.href = url; a.target = "_blank"; a.rel = "noopener";
    a.textContent = "\u25b8 " + (a.hostname || url);
    qrIn.replaceChildren(a);
    const w = window.open(url, "_blank");     // a popup blocker may refuse; the link above stays clickable
    if (w) w.opener = null;
  }
  async function qrPoll() {
    if (qrBusy || qrDone || document.hidden) return;
    qrBusy = true;
    try {
      if (!room) {
        const r = await fetch("api/qr", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
        if (!r.ok) throw 0;
        room = (await r.json()).room;
        try { localStorage.setItem("qr-room", room); } catch {}
      }
      const r = await fetch("api/qr?room=" + encodeURIComponent(room), { cache: "no-store" });
      if (r.status === 404 || r.status === 400) { room = null; return; }    // expired: a new QR next tick
      if (!r.ok) throw 0;
      const { url } = await r.json();
      if (!qrDone) qrDraw();                  // a poll still in flight at the 1-minute mark must not bring it back
      if (url) qrOpen(url);
    } catch {} finally { qrBusy = false; }
  }
  qrPoll();
  const qrTimer = setInterval(qrPoll, 4000);
  document.addEventListener("visibilitychange", qrPoll);
  setTimeout(() => { qrDone = true; clearInterval(qrTimer); qrEl.classList.remove("on"); }, 60e3);   // only the first minute after opening
  addEventListener("resize", () => { if (room && qrShown && !qrDone) { qrShown = ""; qrDraw(); } });

  // ---- QR reader (was decodeQ): camera button; a URL opens, any other text is copied ----
  const camBtn = document.getElementById("cam"), reader = document.getElementById("reader");
  const video = reader.querySelector("video"), hist = reader.querySelector("ul");
  const rdCv = document.createElement("canvas"), rdCx = rdCv.getContext("2d", { willReadFrequently: true });
  let stream = null, jsQR = null, lastCode = "", lastAt = 0, rdGen = 0;
  const loadJsQR = () => jsQR || (jsQR = new Promise((ok, ng) => {
    const sc = document.createElement("script");
    sc.src = "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js";
    sc.onload = () => ok(window.jsQR); sc.onerror = () => { jsQR = null; ng(new Error("could not load the decoder")); };
    document.head.appendChild(sc);
  }));
  function rdAdd(text, link) {
    const li = document.createElement("li");
    if (link) { const a = document.createElement("a"); a.href = text; a.target = "_blank"; a.rel = "noopener"; a.textContent = text; li.appendChild(a); }
    else li.textContent = text;
    if (link === false) { const d = document.createElement("span"); d.className = "dim"; d.textContent = "  COPIED"; li.appendChild(d); }
    hist.prepend(li);
  }
  function rdHandle(text) {
    if (/^https?:\/\//i.test(text)) {
      rdAdd(text, true);
      const w = window.open(text, "_blank");     // may be blocked without a recent click; the link stays in the list
      if (w) w.opener = null;
    } else {
      rdAdd(text, false);
      navigator.clipboard?.writeText(text).catch(() => {});
    }
  }
  function rdScan(decode, gen) {
    if (!stream || gen !== rdGen) return;
    if (video.readyState >= 2 && video.videoWidth) {
      const k = Math.min(1, 640 / video.videoWidth);
      rdCv.width = video.videoWidth * k | 0; rdCv.height = video.videoHeight * k | 0;
      rdCx.drawImage(video, 0, 0, rdCv.width, rdCv.height);
      const c = decode(rdCx.getImageData(0, 0, rdCv.width, rdCv.height).data, rdCv.width, rdCv.height);
      if (c && c.data && (c.data !== lastCode || Date.now() - lastAt > 3000)) { lastCode = c.data; lastAt = Date.now(); rdHandle(c.data); }
    }
    setTimeout(() => rdScan(decode, gen), 120);
  }
  async function rdOpen() {
    reader.hidden = false;
    let s = null;
    try {
      s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
      const decode = await loadJsQR();
      if (reader.hidden) throw 0;                // closed while waiting for permission
      stream = s; video.srcObject = s; video.play().catch(() => {});
      rdScan(decode, ++rdGen);
    } catch (e) {
      if (s && s !== stream) s.getTracks().forEach(t => t.stop());
      if (e) rdAdd("CAMERA ERROR: " + (e.message || e.name || "unavailable"));
    }
  }
  function rdClose() {
    reader.hidden = true;
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null; video.srcObject = null; rdGen++;
  }
  camBtn.addEventListener("click", rdOpen);
  reader.querySelector(".x").addEventListener("click", rdClose);
  addEventListener("keydown", e => { if (e.key === "Escape" && !reader.hidden) rdClose(); });

  resize();
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
