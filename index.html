<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>poet.blue</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #cal {
    position: fixed; right: 20px; top: 16px; margin: 0; pointer-events: none; width: 190px;
    color: #00ff66; font: 12px/1.5 "SF Mono", Menlo, Consolas, monospace; letter-spacing: .06em;
    text-shadow: 0 0 6px rgba(0, 255, 102, .6); user-select: none; opacity: 0; font-variant-numeric: tabular-nums; transition: opacity 1.2s;
  }
  #cal.on { opacity: 1; }
  #cal .row { display: flex; justify-content: space-between; }
  #cal .gap { height: 8px; }
  #cal .bar { height: 7px; border: 1px solid #00ff66; margin: 1px 0 5px; }
  #cal .bar i { display: block; height: 100%; background: rgba(0, 255, 102, .75); box-shadow: 0 0 6px rgba(0, 255, 102, .7); }
  @media (max-width: 640px) { #cal { top: auto; bottom: 14px; right: auto; left: 20px; width: 170px; } }
  #fx {
    position: fixed; right: 20px; bottom: 14px; width: 170px; pointer-events: none; opacity: 0; transition: opacity 1.2s;
    color: #00ff66; font: 12px/1.5 "SF Mono", Menlo, Consolas, monospace; letter-spacing: .06em; text-align: right; white-space: nowrap;
    text-shadow: 0 0 6px rgba(0, 255, 102, .6); user-select: none; font-variant-numeric: tabular-nums;
  }
  #fx.on { opacity: 1; }
  #fx .big { font-size: 22px; line-height: 1.2; }
  #fx .dn { color: #ff6a4f; text-shadow: 0 0 6px rgba(255, 106, 79, .6); }
  #fx .dim { opacity: .55; }
  #fx svg { display: block; width: 100%; height: 46px; margin-top: 4px; overflow: visible; }
  @media (max-width: 640px) { #fx { width: 140px; right: 14px; } #cal { left: 14px; } }
  #term {
    position: fixed; left: 20px; top: 16px; margin: 0; pointer-events: none;
    color: #00ff66; font: 16px/1.5 "SF Mono", Menlo, Consolas, monospace; letter-spacing: .08em;
    text-shadow: 0 0 6px rgba(0, 255, 102, .7); white-space: pre; user-select: none;
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<pre id="term"></pre>
<div id="cal"></div>
<div id="fx"></div>
<script>
(() => {
  const canvas = document.getElementById("gl");
  const gl = canvas.getContext("webgl", { antialias: true, alpha: false, powerPreference: "high-performance" });

  const VS_Q = `attribute vec2 p; varying vec2 uv; void main(){ uv = p * .5 + .5; gl_Position = vec4(p, 0., 1.); }`;
  const FS_Q = `precision mediump float; varying vec2 uv; uniform sampler2D t; uniform float g;
    void main(){ gl_FragColor = vec4(texture2D(t, uv).rgb * g, 1.0); }`;
  function prog(vs, fs) {
    const mk = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); return o; };
    const p = gl.createProgram();
    gl.attachShader(p, mk(gl.VERTEX_SHADER, vs)); gl.attachShader(p, mk(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(p));
    const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) { const nm = gl.getActiveUniform(p, i).name.replace("[0]", ""); u[nm] = gl.getUniformLocation(p, nm); }
    return { p, u };
  }
  // glow target (low-res; linear upsampling = free blur)
  const GS = 3;
  const gTex = gl.createTexture(), gFbo = gl.createFramebuffer();
  let gw = 0, gh = 0;

  let W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    gw = Math.max(1, Math.round(canvas.width / GS)); gh = Math.max(1, Math.round(canvas.height / GS));
    gl.bindTexture(gl.TEXTURE_2D, gTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gw, gh, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.bindFramebuffer(gl.FRAMEBUFFER, gFbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, gTex, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    wake();
  }
  addEventListener("resize", resize);

  // ---- state ----
  const start = performance.now() + 150;   // intro fade-in of the motif
  // ---- weather sky (Open-Meteo, Tokyo): sun/moon on an arc, clouds, rain, snow, fog, lightning ----
  const PARAMS = new URLSearchParams(location.search);       // ?wx=rain|snow|clear|cloudy|fog|thunder  &at=21.5 (JST hour) for demos
  const WX_URL = "https://api.open-meteo.com/v1/forecast?latitude=35.6895&longitude=139.6917" +
    "&current=temperature_2m,weather_code,cloud_cover&daily=sunrise,sunset&timezone=Asia%2FTokyo&forecast_days=2";
  const clockOffset = PARAMS.has("at") ? (() => {
    const j = new Date(Date.now() + 9 * 3600e3), cur = j.getUTCHours() + j.getUTCMinutes() / 60;
    return ((+PARAMS.get("at") - cur) * 3600e3) || 0;
  })() : 0;
  const nowMs = () => Date.now() + clockOffset;
  const jst = s => Date.parse(s + ":00+09:00");
  function classify(code, cloudPct) {
    let kind = "clear", inten = 0, label = "CLEAR";
    if (code === 1) label = "MOSTLY CLEAR"; else if (code === 2) label = "PARTLY CLOUDY"; else if (code === 3) label = "OVERCAST";
    else if (code === 45 || code === 48) { kind = "fog"; label = "FOG"; }
    else if (code >= 51 && code <= 57) { kind = "rain"; inten = .25; label = "DRIZZLE"; }
    else if (code >= 61 && code <= 67) { kind = "rain"; inten = code >= 65 ? 1 : .6; label = code >= 65 ? "HEAVY RAIN" : "RAIN"; }
    else if (code >= 80 && code <= 82) { kind = "rain"; inten = code === 82 ? 1 : .7; label = "SHOWERS"; }
    else if ((code >= 71 && code <= 77) || code === 85 || code === 86) { kind = "snow"; inten = code === 75 || code === 86 ? 1 : .5; label = "SNOW"; }
    else if (code >= 95) { kind = "thunder"; inten = 1; label = "THUNDERSTORM"; }
    let cloud = cloudPct / 100;
    if (kind !== "clear" && kind !== "fog") cloud = Math.max(cloud, .7);
    return { kind, inten, cloud, label };
  }
  let wx = null, wxAt = 0;
  async function loadWx() {
    try {
      let d;
      if (PARAMS.has("wx")) {
        const day = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10), nd = new Date(Date.now() + 33 * 3600e3).toISOString().slice(0, 10);
        const m = { clear: [0, 5], cloudy: [3, 90], fog: [45, 60], rain: [63, 100], snow: [73, 100], thunder: [95, 100] }[PARAMS.get("wx")] || [0, 5];
        d = { current: { temperature_2m: 18.4, weather_code: m[0], cloud_cover: m[1] },
              daily: { sunrise: [day + "T06:00", nd + "T06:00"], sunset: [day + "T17:00", nd + "T17:00"] } };
      } else {
        const r = await fetch(WX_URL); if (!r.ok) throw 0; d = await r.json();
      }
      wx = Object.assign(classify(d.current.weather_code, d.current.cloud_cover), {
        temp: d.current.temperature_2m,
        riseS: d.daily.sunrise[0].slice(11, 16), setS: d.daily.sunset[0].slice(11, 16),
        rise: jst(d.daily.sunrise[0]), set: jst(d.daily.sunset[0]), nextRise: jst(d.daily.sunrise[1]),
      });
      wxAt = performance.now(); wake();
    } catch {}
  }
  const wxReady = loadWx();
  setInterval(loadWx, 15 * 60e3);

  const pSky = prog(`attribute vec3 s_p; uniform vec2 u_res; varying float v_a;
    void main() { gl_Position = vec4(s_p.x / u_res.x * 2. - 1., 1. - s_p.y / u_res.y * 2., 0., 1.); v_a = s_p.z; }`,
    `precision mediump float; varying float v_a; uniform float u_glow;
    void main() { vec3 c = vec3(0., 1., .4); gl_FragColor = u_glow > .5 ? vec4(c * v_a, 1.) : vec4(c, v_a); }`);
  const bSky = gl.createBuffer();
  let skyN = 0, rain = [], snow = [], bolt = null, boltAt = 0, flash = 0, lastSky = 0;
  const frac = x => x - Math.floor(x);
  // ---- monthly motif (wireframe, centerpiece). ?m=1..12 previews a month ----
  function drawMotif(month, cx, cy, S, t, poly, arc) {
    const TAU = Math.PI * 2, frac1 = x => x - Math.floor(x);
    const P = (x, y) => [cx + x * S, cy + y * S];
    const L = (pts, a, close) => poly(pts.map(p => P(p[0], p[1])), a == null ? .7 : a, close);
    const E = (x, y, rx, ry, a, rot, n) => {
      const o = [], c = Math.cos(rot || 0), s = Math.sin(rot || 0);
      for (let i = 0; i < (n || 28); i++) { const q = i / (n || 28) * TAU, px = Math.cos(q) * rx, py = Math.sin(q) * ry; o.push([x + px * c - py * s, y + px * s + py * c]); }
      L(o, a, true);
    };
    const C = (x, y, r, a) => E(x, y, r, r, a, 0, 24);
    const rotP = (pts, x, y, s, rot) => pts.map(p => [x + (p[0] * Math.cos(rot) - p[1] * Math.sin(rot)) * s, y + (p[0] * Math.sin(rot) + p[1] * Math.cos(rot)) * s]);
    const petal = (x, y, s, rot, a) => L(rotP([[0, -1], [.6, -.45], [.4, .9], [0, .55], [-.4, .9], [-.6, -.45]], x, y, s, rot), a, true);
    const star = (x, y, r, rot, a, k) => { const o = []; for (let i = 0; i < 2 * k; i++) { const q = i * Math.PI / k + rot, rr = i % 2 ? r * .45 : r; o.push([x + Math.cos(q) * rr, y + Math.sin(q) * rr]); } L(o, a, true); };
    const cross = (x, y, z, a) => { L([[x - z, y], [x + z, y]], a); L([[x, y - z], [x, y + z]], a); };
    const flower = (x, y, s, rot) => { for (let i = 0; i < 5; i++) { const q = i * TAU / 5 + rot; C(x + Math.cos(q) * s * .55, y + Math.sin(q) * s * .55, s * .38, .7); } C(x, y, s * .14, .8); for (let i = 0; i < 5; i++) { const q = i * TAU / 5 + rot + .3; L([[x, y], [x + Math.cos(q) * s * .3, y + Math.sin(q) * s * .3]], .6); } };
    const snow = (n, sp) => { for (let i = 0; i < n; i++) { const x = (frac1(i * .618) * 2.8 - 1.4) + Math.sin(t * .8 + i) * .06, y = frac1(t * sp + i * .137) * 2.4 - 1.2; cross(x, y, .035, .55); } };
    switch (month) {
      case 1: // Mt. Fuji + first sunrise
        L([[-1.3, .75], [-.45, -.35], [-.28, -.5], [.28, -.5], [.45, -.35], [1.3, .75]]);
        L([[-.45, -.35], [-.3, -.18], [-.15, -.32], [0, -.12], [.15, -.32], [.3, -.18], [.45, -.35]], .6);
        L([[-1.5, .75], [1.5, .75]], .5); C(.1, -.95, .16, .8);
        for (let i = 0; i < 8; i++) { const q = i * TAU / 8 + t * .1; L([[.1 + Math.cos(q) * .24, -.95 + Math.sin(q) * .24], [.1 + Math.cos(q) * .36, -.95 + Math.sin(q) * .36]], .5); }
        L([[-1.1, -.2], [-.6, -.2]], .4); L([[.7, .05], [1.2, .05]], .4); break;
      case 2: // plum blossoms
        L([[-1.4, .9], [-.8, .5], [-.3, .3], [.2, -.1], [.8, -.35]], .55); L([[-.3, .3], [-.5, -.1], [-.4, -.5]], .45);
        flower(-.4, -.5, .38, .2); flower(.45, -.1, .3, .9); flower(-.05, .15, .22, 1.7); flower(.85, -.4, .2, .4); break;
      case 3: // hishimochi (diamond rice cakes) + peach petals
        [[-.62, .5], [.0, .55], [.62, .6]].forEach(([d, y, w], k) => { const yy = [.5, 0, -.5][k], ww = [.75, .75, .75][k]; L([[0, yy - .32], [ww, yy], [0, yy + .32], [-ww, yy]], .7, true); });
        L([[-.75, -.2], [0, .15]], .0); for (let i = 0; i < 6; i++) petal(-1.1 + (i % 3) * .08, -.6 + i * .25 + Math.sin(t + i) * .03, .06, t * .5 + i, .5); break;
      case 4: // cherry blossoms + falling petals
        flower(-.5, -.3, .5, t * .05); flower(.55, .1, .36, 1 + t * .04);
        for (let i = 0; i < 22; i++) petal(frac1(i * .381) * 2.8 - 1.4 + Math.sin(t * .7 + i) * .12, frac1(t * .07 + i * .137) * 2.4 - 1.2, .06, t * 1.2 + i, .6); break;
      case 5: // carp streamers
        L([[-1.1, -1], [-1.1, 1]], .6); C(-1.1, -1.06, .06, .8);
        [[-.25, 1], [.5, .7]].forEach(([oy, sc], k) => {
          const top = [], bot = [], n = 12;
          for (let i = 0; i <= n; i++) { const u = i / n, x = -1.0 + 1.15 * u * sc, w = .26 * sc * (1 - .6 * u), yc = oy + Math.sin(t * 2.2 - u * 3 + k) * .09 * u; top.push([x, yc - w]); bot.push([x, yc + w]); if (i % 3 === 1) L([[x, yc - w], [x, yc + w]], .3); }
          L(top); L(bot); L([top[0], bot[0]], .6);
          const a = top[n], b = bot[n]; L([a, [a[0] + .25 * sc, a[1] - .12 * sc], [b[0] + .25 * sc, b[1] + .12 * sc], b], .65);
          C(top[1][0] + .02, oy - .03 * sc + Math.sin(t * 2.2 + k) * .003, .025 * sc, .8); L([[-1.1, -.9], top[0]], .35);
        }); break;
      case 6: { // umbrella in the rain
        const ox = 0, oy = -.1, n = 20;
        const top = []; for (let i = 0; i <= n; i++) { const q = Math.PI + (i / n) * Math.PI; top.push([ox + Math.cos(q) * .95, oy + Math.sin(q) * .75]); }
        L(top); for (let i = 0; i < 5; i++) { const a = top[i * 4], b = top[(i + 1) * 4]; const m = [(a[0] + b[0]) / 2, a[1] + .12]; L([a, m, b], .6); }
        for (let i = 1; i < 5; i++) L([[ox, oy - .75], top[i * 4]], .4);
        L([[ox, oy - .75], [ox, .8], [ox - .08, .92], [ox - .22, .9]], .65);
        for (let i = 0; i < 16; i++) { const x = frac1(i * .618) * 2.8 - 1.4, y = frac1(t * .9 + i * .137) * 2.4 - 1.2; L([[x, y], [x - .02, y + .1]], .45); } break; }
      case 7: // tanabata: bamboo, tanzaku, stars
        L([[.1, 1.1], [.15, -1.1]], .6); for (let i = 0; i < 5; i++) L([[.09 + i * .005, .8 - i * .45], [.17 + i * .005, .8 - i * .45]], .4);
        for (let i = 0; i < 6; i++) { const y = -1 + i * .35, d = i % 2 ? 1 : -1; L([[.14, y], [.14 + d * (.5 + (i % 3) * .1), y - .22 + Math.sin(t * 1.2 + i) * .02]], .35); }
        [[-.35, -.1, 0], [.5, .25, 1], [-.6, .4, 2], [.65, -.5, 3]].forEach(([x, y, k]) => { const s = Math.sin(t * 1.1 + k) * .06; const pts = rotP([[-.07, 0], [.07, 0], [.07, .4], [-.07, .4]], x, y, 1, s); L(pts, .65, true); L([[x, y - .22], [x, y]], .4); });
        star(-1, -.7, .1, t * .2, .75, 4); star(1, -.5, .1, -t * .2, .75, 4);
        for (let i = 0; i < 16; i++) { const k = i / 15; cross(-1 + 2 * k, -.7 + .2 * k + Math.sin(k * 6) * .08, .02, .35 + .25 * Math.sin(t * 2 + i)); } break;
      case 8: // fireworks
        [[-.8, -.3, 0], [.05, -.65, .33], [.85, -.15, .66]].forEach(([x, y, off]) => {
          const ph = frac1(t * .22 + off), r = ph * .75, a = Math.max(0, 1 - ph) * .9;
          for (let i = 0; i < 18; i++) { const q = i * TAU / 18 + off; L([[x + Math.cos(q) * r * .7, y + Math.sin(q) * r * .7], [x + Math.cos(q) * r, y + Math.sin(q) * r]], a); }
          if (ph > .2) for (let i = 0; i < 9; i++) { const q = i * TAU / 9 + .3, r2 = r * .45; cross(x + Math.cos(q) * r2, y + Math.sin(q) * r2 + ph * .15, .025, a * .8); }
          if (ph < .15) L([[x, 1.1], [x, y + (1.1 - y) * (1 - ph / .15)]], .6);
        }); break;
      case 9: { // moon rabbit pounding mochi
        C(0, -.1, .9, .75); E(-.35, -.35, .1, .06, .25, 0, 14); E(.4, .15, .14, .08, .2, 0, 14);
        const hop = Math.sin(t * 3) * .06;
        E(.12, -.18, .24, .17, .75, -.3); E(.34, -.4 + hop * .3, .11, .1, .75, 0);
        E(.3, -.66, .045, .2, .75, -.25, 14); E(.42, -.64, .045, .2, .75, .2, 14); C(.38, -.42, .016, .9);
        L([[-.28, .05], [-.2, .22], [.1, .22], [.18, .05]], .75, true); L([[-.3, .05], [.2, .05]], .7);
        const sw = Math.sin(t * 3) * .5; L([[.28, -.25], [.28 - Math.sin(sw) * .4, -.25 - Math.cos(sw) * .4 - .2]], .75); E(.28 - Math.sin(sw) * .4, -.25 - Math.cos(sw) * .4 - .2, .07, .04, .7, sw, 10);
        for (let k = 0; k < 6; k++) { const x = -1.3 + k * .14, h = .75 + (k % 3) * .12, sway = Math.sin(t * .9 + k) * .05; L([[x, 1.1], [x + .05 + sway * .5, 1.1 - h * .55], [x + .1 + sway, 1.1 - h]], .5); for (let j = 0; j < 4; j++) L([[x + .1 + sway, 1.1 - h + j * .05], [x + .16 + sway, 1.1 - h + j * .05 - .06]], .4); } break; }
      case 10: { // Halloween: jack-o'-lantern + bats
        const f = .75 + .25 * Math.abs(Math.sin(t * 5.3) * Math.sin(t * 2.1));
        E(0, .15, .85, .65, .75); E(-.4, .15, .45, .63, .35); E(.4, .15, .45, .63, .35);
        L([[-.1, -.5], [-.06, -.75], [.14, -.82], [.1, -.5]], .65);
        L([[-.45, -.1], [-.15, -.1], [-.3, -.4]], .85 * f, true); L([[.45, -.1], [.15, -.1], [.3, -.4]], .85 * f, true); L([[-.07, .1], [.07, .1], [0, 0]], .85 * f, true);
        L([[-.55, .3], [-.4, .5], [-.28, .35], [-.14, .52], [0, .36], [.14, .52], [.28, .35], [.4, .5], [.55, .3]], .85 * f);
        for (let k = 0; k < 3; k++) { const bx = ((t * .08 * (1 + k * .3) + k * .37) % 1) * 3.2 - 1.6, by = -.75 + k * .22 + Math.sin(t * .9 + k) * .08, fl = 1 + Math.sin(t * 9 + k) * .45; L(rotP([[-.3, 0], [-.15, -.1 * fl], [0, .02], [.15, -.1 * fl], [.3, 0], [.2, .06], [.1, 0], [0, .12], [-.1, 0], [-.2, .06]], bx, by, .6, 0), .7, true); }
        break; }
      case 11: // maple leaves
        { const mp = (x, y, s, rot, a) => { const o = []; for (let i = 0; i < 10; i++) { const q = i * Math.PI / 5 - Math.PI / 2, r = i % 2 ? .5 : 1; o.push([Math.cos(q) * r * (i === 0 ? 1.1 : 1), Math.sin(q) * r]); } L(rotP(o, x, y, s, rot), a, true); L(rotP([[0, .5], [0, 1.1]], x, y, s, rot), a); L(rotP([[0, .5], [0, -.7]], x, y, s, rot), a * .5); };
          mp(0, -.1, .75, Math.sin(t * .5) * .08, .8);
          for (let i = 0; i < 12; i++) mp(frac1(i * .618) * 2.8 - 1.4 + Math.sin(t * .6 + i) * .15, frac1(t * .06 + i * .137) * 2.4 - 1.2, .09, t * 1.1 + i * 1.3, .6); } break;
      case 12: // Christmas tree + snow
        L([[0, -.9], [-.38, -.35], [.38, -.35]], .75, true); L([[0, -.62], [-.55, .1], [.55, .1]], .75, true); L([[0, -.2], [-.75, .68], [.75, .68]], .75, true);
        L([[-.1, .68], [-.1, .95], [.1, .95], [.1, .68]], .7, true); star(0, -1.02, .13, t * .4 - Math.PI / 2, .9, 5);
        L([[-.3, -.4], [-.1, -.32], [.1, -.4], [.3, -.32]], .35); L([[-.48, .05], [-.2, .15], [.2, .05], [.48, .15]], .35); L([[-.62, .55], [-.3, .66], [.3, .55], [.62, .66]], .35);
        [[-.18, -.12], [.2, -.1], [-.38, .38], [.1, .42], [.42, .5], [-.05, -.5], [-.55, .6], [.3, .2]].forEach(([x, y], i) => C(x, y, .035, .3 + .65 * Math.abs(Math.sin(t * 2 + i))));
        [[-1, .62, .3, .3], [.82, .7, .22, .22]].forEach(([x, y, w, h]) => { L([[x, y], [x + w, y], [x + w, y + h], [x, y + h]], .65, true); L([[x + w / 2, y], [x + w / 2, y + h]], .5); L([[x, y + h / 2], [x + w, y + h / 2]], .5); });
        snow(26, .06); break;
    }
  }
  function buildSky(now) {
    skyN = 0;
    const dt = Math.min(.05, Math.max(0, (now - lastSky) / 1000)); lastSky = now;
    const t = now / 1000; let fade = wx ? Math.min(1, (now - wxAt) / 1500) : 0;
    const V = [];
    const seg = (x1, y1, x2, y2, a) => { V.push(x1, y1, a * fade, x2, y2, a * fade); };
    const poly = (p, a, close) => { for (let i = 0; i < p.length - 1; i++) seg(p[i][0], p[i][1], p[i + 1][0], p[i + 1][1], a); if (close) seg(p[p.length - 1][0], p[p.length - 1][1], p[0][0], p[0][1], a); };
    const arc = (cx, cy, r, a0, a1, n) => { const o = []; for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; o.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); } return o; };
    const flush = () => { skyN = V.length / 3; gl.bindBuffer(gl.ARRAY_BUFFER, bSky); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(V), gl.DYNAMIC_DRAW); };
    {   // monthly motif
      const keep = fade; fade = Math.min(1, Math.max(0, (now - start - 300) / 3000)) * .9;
      const month = +PARAMS.get("m") || new Date(nowMs()).getMonth() + 1;
      if (H > W * 1.1) drawMotif(month, W * .5, H * .5, Math.min(W * .3, H * .17), t, poly, arc);
      else drawMotif(month, W * .5, H * .52, Math.min(W * .26, H * .28), t, poly, arc);
      fade = keep;
    }
    if (!wx) { flush(); return; }
    const tNow = nowMs(), day = tNow >= wx.rise && tNow <= wx.set;
    let p;
    if (day) p = (tNow - wx.rise) / (wx.set - wx.rise);
    else { const prevSet = tNow < wx.rise ? wx.set - 864e5 : wx.set, nextRise = tNow < wx.rise ? wx.rise : wx.nextRise; p = (tNow - prevSet) / (nextRise - prevSet); }
    p = Math.min(1, Math.max(0, p));
    const hy = H * .46, bx = W * (.12 + .76 * p), by = hy - Math.sin(Math.PI * p) * H * .36;
    const R = Math.min(60, Math.max(26, Math.min(W, H) * .07));
    const bad = wx.kind === "rain" || wx.kind === "thunder" || wx.kind === "snow";
    const vis = Math.max(.2, 1 - wx.cloud * .8) * (wx.kind === "fog" ? .6 : 1) * (bad ? .5 : 1);
    // sun / moon
    if (day) {
      poly(arc(bx, by, R, 0, Math.PI * 2, 32), .9 * vis, true);
      poly(arc(bx, by, R * .6, 0, Math.PI * 2, 24), .35 * vis, true);
      for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6 + t * .12; seg(bx + Math.cos(a) * R * 1.3, by + Math.sin(a) * R * 1.3, bx + Math.cos(a) * R * 1.75, by + Math.sin(a) * R * 1.75, .6 * vis); }
    } else {
      const off = R * .55, ri = R * .85, o = arc(bx, by, R, 0, Math.PI * 2, 48), q = arc(bx + off, by - off * .3, ri, 0, Math.PI * 2, 48);
      for (let i = 0; i < 48; i++) {
        const m = [(o[i][0] + o[i + 1][0]) / 2, (o[i][1] + o[i + 1][1]) / 2];
        if (Math.hypot(m[0] - (bx + off), m[1] - (by - off * .3)) >= ri) seg(o[i][0], o[i][1], o[i + 1][0], o[i + 1][1], .9 * vis);
        const n2 = [(q[i][0] + q[i + 1][0]) / 2, (q[i][1] + q[i + 1][1]) / 2];
        if (Math.hypot(n2[0] - bx, n2[1] - by) < R) seg(q[i][0], q[i][1], q[i + 1][0], q[i + 1][1], .9 * vis);
      }
      const ns = Math.round(46 * (1 - wx.cloud * .8));
      for (let i = 0; i < ns; i++) {
        const sx = frac(Math.sin(i * 12.9898) * 43758.5453) * W, sy = frac(Math.sin(i * 78.233) * 12345.678) * H * .42;
        const a = (.25 + .55 * Math.abs(Math.sin(t * 1.3 + i))) * (bad ? .4 : 1), z = 2 + (i % 3);
        seg(sx - z, sy, sx + z, sy, a); seg(sx, sy - z, sx, sy + z, a);
      }
    }
    // sunrise / sunset: horizon line + rings radiating from the sun
    const near = Math.min(Math.abs(tNow - wx.rise), Math.abs(tNow - wx.set)) / 60e3;
    if (near < 45) {
      const tw = 1 - near / 45;
      for (let x = 0; x < W; x += 28) seg(x, hy, x + 14, hy, .45 * tw);
      for (let k = 0; k < 3; k++) { const ph = frac(t * .18 + k / 3); poly(arc(bx, by, R * (1.8 + ph * 2.2), Math.PI, Math.PI * 2, 32), (1 - ph) * .5 * tw, false); }
    }
    // clouds
    const nc = Math.round(wx.cloud * 5);
    for (let i = 0; i < nc; i++) {
      const s = 150 + (i % 3) * 60, cy = H * (.14 + .06 * ((i * 37) % 5)), cx = ((i * .37 * W + t * (8 + i * 3)) % (W + 400)) - 200;
      const pts = [[cx, cy]];
      [[.22, .22], [.55, .3], [.85, .17]].forEach(([f, r]) => arc(cx + f * s, cy, r * s, Math.PI, Math.PI * 2, 10).forEach(q => pts.push(q)));
      pts.push([cx + 1.02 * s, cy]);
      poly(pts, .55 * Math.min(1, .4 + wx.cloud));
      seg(cx, cy, cx + 1.02 * s, cy, .55);
    }
    // fog
    if (wx.kind === "fog") for (let i = 0; i < 9; i++) {
      const y = H * (.3 + .07 * i), sh = (t * (10 + i * 2)) % 60;
      for (let x = -60; x < W; x += 60) seg(x + sh + (i % 2) * 30, y, x + sh + 40 + (i % 2) * 30, y, .22);
    }
    // rain / thunder
    if (wx.kind === "rain" || wx.kind === "thunder") {
      const target = Math.round(50 + wx.inten * 190);
      while (rain.length < target) rain.push({ x: Math.random() * (W + 200) - 100, y: Math.random() * H, v: 700 + Math.random() * 500, l: 12 + Math.random() * 14 });
      rain.length = target;
      const slant = .18;
      for (const d of rain) {
        d.y += d.v * dt; d.x -= d.v * dt * slant;
        if (d.y > H + 30) { d.y = -30; d.x = Math.random() * (W + 200) - 100 + H * slant; }
        seg(d.x, d.y, d.x + d.l * slant, d.y - d.l, .45);
      }
    }
    // snow
    if (wx.kind === "snow") {
      const target = Math.round(40 + wx.inten * 90);
      while (snow.length < target) snow.push({ x: Math.random() * W, y: Math.random() * H, v: 50 + Math.random() * 70, ph: Math.random() * 6.28, z: 2 + Math.random() * 2.5 });
      snow.length = target;
      for (const f of snow) {
        f.y += f.v * dt; if (f.y > H + 10) { f.y = -10; f.x = Math.random() * W; }
        const x = f.x + Math.sin(t * .8 + f.ph) * 18, z = f.z;
        seg(x - z, f.y, x + z, f.y, .7); seg(x, f.y - z, x, f.y + z, .7); seg(x - z * .7, f.y - z * .7, x + z * .7, f.y + z * .7, .45); seg(x - z * .7, f.y + z * .7, x + z * .7, f.y - z * .7, .45);
      }
    }
    // lightning
    if (wx.kind === "thunder") {
      if (now > boltAt) {
        boltAt = now + 3500 + Math.random() * 5000;
        let x = W * (.2 + Math.random() * .6), y = H * .12; bolt = [[x, y]];
        while (y < H * .6) { x += (Math.random() - .5) * 60; y += 30 + Math.random() * 30; bolt.push([x, y]); }
        flash = 1;
      }
      if (flash > 0) { poly(bolt, Math.min(1, flash * 1.6), false); flash -= dt * 2.5; }
    }
    flush();
  }
  function drawSky(glow) {
    if (!skyN) return;
    gl.useProgram(pSky.p);
    gl.uniform2f(pSky.u.u_res, W, H); gl.uniform1f(pSky.u.u_glow, glow);
    gl.bindBuffer(gl.ARRAY_BUFFER, bSky);
    const l = gl.getAttribLocation(pSky.p, "s_p");
    gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, 3, gl.FLOAT, false, 12, 0);
    gl.drawArrays(gl.LINES, 0, skyN);
  }

  const bQuad = (() => { const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW); return b; })();
  const pQuad = prog(VS_Q, FS_Q);

  function draw(now) {
    buildSky(now);
    // glow pass (low res; linear upsampling = free blur)
    gl.bindFramebuffer(gl.FRAMEBUFFER, gFbo);
    gl.viewport(0, 0, gw, gh);
    gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
    drawSky(1);
    // main pass
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.blendFunc(gl.ONE, gl.ONE);
    gl.useProgram(pQuad.p);
    gl.bindBuffer(gl.ARRAY_BUFFER, bQuad);
    const lq = gl.getAttribLocation(pQuad.p, "p");
    gl.enableVertexAttribArray(lq); gl.vertexAttribPointer(lq, 2, gl.FLOAT, false, 0, 0);
    gl.bindTexture(gl.TEXTURE_2D, gTex); gl.uniform1i(pQuad.u.t, 0); gl.uniform1f(pQuad.u.g, 0.55);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    drawSky(0);
  }

  // the sky animates continuously; cap at ~30fps
  let raf = 0, last = 0;
  function frame(now) {
    raf = requestAnimationFrame(frame);
    if (now - last >= 33) { last = now; draw(now); }
  }
  function wake() { if (!raf) raf = requestAnimationFrame(frame); }
  document.addEventListener("visibilitychange", () => { if (!document.hidden) wake(); });

  // ---- terminal readout (shown immediately), live clock, weather lines once loaded ----
  const term = document.getElementById("term");
  const p2 = n => String(n).padStart(2, "0");
  const lineFns = [
    () => "poet.blue homepage",
    () => { const d = new Date(); return `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())} ${["SUNDAY","MONDAY","TUESDAY","WEDNESDAY","THURSDAY","FRIDAY","SATURDAY"][d.getDay()]}`; },
    () => { const d = new Date(); return `${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`; },
    () => wx ? `TOKYO ${wx.temp.toFixed(1)}C ${wx.label}` : "",
    () => wx ? `SUNRISE ${wx.riseS}  SUNSET ${wx.setS}` : "",
  ];
  const lineEls = lineFns.map(() => { const d = document.createElement("div"); term.appendChild(d); return d; });
  const termTick = () => lineEls.forEach((el, i) => { const t = lineFns[i](); if (el.textContent !== t) el.textContent = t; });
  termTick(); setInterval(termTick, 1000);
  wxReady.then(termTick);

  // ---- calendar countdown + progress bars (local time, week starts Monday) ----
  const cal = document.getElementById("cal");
  const DAY = 864e5;
  function calTick() {
    const n = new Date(), y = n.getFullYear(), m = n.getMonth();
    const d0 = new Date(y, m, n.getDate()), dow = (n.getDay() + 6) % 7;
    const span = (a, b) => (n - a) / (b - a);
    const nextM = new Date(y, m + 1, 1), nextY = new Date(y + 1, 0, 1);
    const bars = [
      ["DAY", span(d0, new Date(y, m, n.getDate() + 1))],
      ["WEEK", span(new Date(y, m, n.getDate() - dow), new Date(y, m, n.getDate() - dow + 7))],
      ["MONTH", span(new Date(y, m, 1), nextM)],
      ["YEAR", span(new Date(y, 0, 1), nextY)],
    ];
    const left = t => Math.round((t - d0) / DAY);
    cal.innerHTML =
      `<div class="row"><span>NEXT MONTH</span><span>${left(nextM)} DAYS</span></div>` +
      `<div class="row"><span>NEXT YEAR</span><span>${left(nextY)} DAYS</span></div><div class="gap"></div>` +
      bars.map(([k, f]) => `<div class="row"><span>${k}</span><span>${(f * 100).toFixed(3)}%</span></div><div class="bar"><i style="width:${(f * 100).toFixed(2)}%"></i></div>`).join("");
  }
  calTick(); setInterval(calTick, 500);
  setTimeout(() => cal.classList.add("on"), 1200);

  // ---- USD/JPY: latest rate + 30-day sparkline (Frankfurter = ECB daily reference rates; not real time) ----
  const fx = document.getElementById("fx");
  function fxRender(series) {      // series: [[date, rate], ...] oldest -> newest
    if (!series || series.length < 2) return;
    const pts = series.slice(-30), last = pts[pts.length - 1], prev = pts[pts.length - 2];
    const lo = Math.min(...pts.map(p => p[1])), hi = Math.max(...pts.map(p => p[1])), span = hi - lo || 1;
    const X = i => (i / (pts.length - 1)) * 170, Y = v => 42 - ((v - lo) / span) * 38;
    const line = pts.map((p, i) => `${X(i).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(" ");
    const d = last[1] - prev[1], pct = d / prev[1] * 100, down = d < 0;
    fx.innerHTML =
      `<div class="dim">USD/JPY ${last[0].slice(5)}${[0, 6].includes(new Date(Date.now() + 9 * 36e5).getUTCDay()) ? " CLOSED" : ""}</div>` +
      `<div class="big">¥${last[1].toFixed(2)}</div>` +
      `<div class="${down ? "dn" : ""}">${down ? "▼" : "▲"} ${Math.abs(d).toFixed(2)} (${Math.abs(pct).toFixed(2)}%)</div>` +
      `<svg viewBox="0 0 170 46" preserveAspectRatio="none"><polygon points="0,46 ${line} 170,46" fill="rgba(0,255,102,.12)"/>` +
      `<polyline points="${line}" fill="none" stroke="#00ff66" stroke-width="1.5" vector-effect="non-scaling-stroke"/>` +
      `<circle cx="170" cy="${Y(last[1]).toFixed(1)}" r="2.5" fill="#00ff66"/></svg>` +
      `<div class="dim">${pts.length}D ${lo.toFixed(1)}-${hi.toFixed(1)}</div>`;
    fx.classList.add("on");
  }
  async function fxLoad() {
    try { const c = JSON.parse(localStorage.getItem("fx") || "null"); if (c) fxRender(c); } catch {}
    try {
      let series;
      if (PARAMS.get("fx") === "demo") {
        let v = 150; series = Array.from({ length: 30 }, (_, i) => [`2026-10-${String(i % 28 + 1).padStart(2, "0")}`, (v += Math.sin(i * 1.3) * .8 + .15)]);
      } else {
        const iso = t => new Date(t).toISOString().slice(0, 10), now = Date.now();
        const r = await fetch(`https://api.frankfurter.dev/v1/${iso(now - 50 * 864e5)}..${iso(now)}?base=USD&symbols=JPY`);
        if (!r.ok) throw 0;
        const j = await r.json();
        series = Object.keys(j.rates).sort().map(k => [k, j.rates[k].JPY]).filter(p => isFinite(p[1]));
      }
      if (series.length < 2) throw 0;
      fxRender(series);
      try { localStorage.setItem("fx", JSON.stringify(series)); } catch {}
    } catch {}
  }
  fxLoad(); setInterval(fxLoad, 30 * 60e3);

  resize();
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
