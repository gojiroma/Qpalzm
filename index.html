<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>poet.blue keyboard</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; display: block; }
  #search { position: fixed; inset: 0; display: none; background: rgba(0, 0, 0, .6); }
  #search.on { display: block; }
  #sbox {
    position: absolute; left: 50%; top: 14%; transform: translateX(-50%); width: min(640px, calc(100% - 32px));
    background: rgba(0, 0, 0, .92); border: 1px solid #00ff66; box-shadow: 0 0 18px rgba(0, 255, 102, .35);
    color: #00ff66; font: 16px/1.5 "SF Mono", Menlo, Consolas, monospace; padding: 12px 14px;
  }
  #sbar { display: flex; gap: 10px; border-bottom: 1px solid #00ff66; padding-bottom: 6px; }
  #sq { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: #00ff66; font: inherit; font-size: 20px; caret-color: #00ff66; }
  #slist { margin-top: 6px; max-height: 50vh; overflow: auto; }
  #slist a, #slist div { display: flex; justify-content: space-between; gap: 10px; padding: 3px 6px; color: #00ff66; text-decoration: none; cursor: pointer; }
  #slist .active, #slist a:hover, #slist div:hover { background: rgba(0, 255, 102, .18); }
  #slist mark { background: none; color: #fff; font-weight: 600; }
  #slist .tags, #smeta { color: rgba(0, 255, 102, .5); font-size: 12px; }
  #smeta { margin-top: 4px; }
  #cal {
    position: fixed; right: 20px; top: 16px; margin: 0; pointer-events: none; width: 190px;
    color: #00ff66; font: 12px/1.5 "SF Mono", Menlo, Consolas, monospace; letter-spacing: .06em;
    text-shadow: 0 0 6px rgba(0, 255, 102, .6); user-select: none; opacity: 0; font-variant-numeric: tabular-nums; transition: opacity 1.2s;
  }
  #cal.on { opacity: 1; }
  #cal .row { display: flex; justify-content: space-between; }
  #cal .gap { height: 8px; }
  #cal .bar { height: 7px; border: 1px solid #00ff66; margin: 1px 0 5px; }
  #cal .bar i { display: block; height: 100%; background: rgba(0, 255, 102, .75); box-shadow: 0 0 6px rgba(0, 255, 102, .7); }
  @media (max-width: 640px) { #cal { top: auto; bottom: 14px; right: auto; left: 20px; width: 170px; } }
  #fx {
    position: fixed; right: 20px; bottom: 14px; width: 170px; pointer-events: none; opacity: 0; transition: opacity 1.2s;
    color: #00ff66; font: 12px/1.5 "SF Mono", Menlo, Consolas, monospace; letter-spacing: .06em; text-align: right; white-space: nowrap;
    text-shadow: 0 0 6px rgba(0, 255, 102, .6); user-select: none; font-variant-numeric: tabular-nums;
  }
  #fx.on { opacity: 1; }
  #fx .big { font-size: 22px; line-height: 1.2; }
  #fx .dn { color: #ff6a4f; text-shadow: 0 0 6px rgba(255, 106, 79, .6); }
  #fx .dim { opacity: .55; }
  #fx svg { display: block; width: 100%; height: 46px; margin-top: 4px; overflow: visible; }
  @media (max-width: 640px) { #fx { width: 140px; right: 14px; } #cal { left: 14px; } }
  #tip {
    position: fixed; left: 0; top: 0; max-width: 260px; padding: 8px 10px; opacity: 0;
    pointer-events: none; background: rgba(0, 0, 0, .85); border: 1px solid #00ff66;
    color: #cfe; font: 12px/1.5 "SF Mono", Menlo, Consolas, monospace; transition: opacity .12s;
  }
  #term {
    position: fixed; left: 20px; top: 16px; margin: 0; pointer-events: none;
    color: #00ff66; font: 16px/1.5 "SF Mono", Menlo, Consolas, monospace; letter-spacing: .08em;
    text-shadow: 0 0 6px rgba(0, 255, 102, .7); white-space: pre; user-select: none;
  }
  #term i { font-style: normal; display: inline-block; width: .6em; height: 1em; margin-left: 2px;
    background: #00ff66; vertical-align: -.12em; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<pre id="term"></pre>
<div id="cal"></div>
<div id="fx"></div>
<div id="tip"></div>
<div id="search"><div id="sbox"><label id="sbar"><span>&rsaquo;</span><input id="sq" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="host"></label><div id="slist"></div><div id="smeta"></div></div></div>
<script>
(() => {
  const U = 56, KH = 22, BH = 8, GAP = 4, PAD = 14, DOMAIN = "poet.blue";
  const canvas = document.getElementById("gl");
  const gl = canvas.getContext("webgl", { antialias: true, alpha: false, powerPreference: "high-performance" });

  // ---- stroke font (2 x 4 grid, y down) ----
  const F = {
    a:[[[0,4],[1,0],[2,4]],[[.5,2.5],[1.5,2.5]]],
    b:[[[0,0],[0,4],[1.4,4],[2,3.4],[2,2.7],[1.4,2.1],[0,2.1]],[[1.4,2.1],[2,1.5],[2,.6],[1.4,0],[0,0]]],
    c:[[[2,.6],[1.4,0],[.6,0],[0,.6],[0,3.4],[.6,4],[1.4,4],[2,3.4]]],
    d:[[[0,0],[0,4],[1.2,4],[2,3.2],[2,.8],[1.2,0],[0,0]]],
    e:[[[2,0],[0,0],[0,4],[2,4]],[[0,2],[1.5,2]]],
    f:[[[2,0],[0,0],[0,4]],[[0,2],[1.5,2]]],
    g:[[[2,.6],[1.4,0],[.6,0],[0,.6],[0,3.4],[.6,4],[1.4,4],[2,3.4],[2,2],[1,2]]],
    h:[[[0,0],[0,4]],[[2,0],[2,4]],[[0,2],[2,2]]],
    i:[[[.3,0],[1.7,0]],[[1,0],[1,4]],[[.3,4],[1.7,4]]],
    j:[[[2,0],[2,3.4],[1.4,4],[.6,4],[0,3.4]]],
    k:[[[0,0],[0,4]],[[2,0],[0,2.2]],[[.6,1.6],[2,4]]],
    l:[[[0,0],[0,4],[2,4]]],
    m:[[[0,4],[0,0],[1,2],[2,0],[2,4]]],
    n:[[[0,4],[0,0],[2,4],[2,0]]],
    o:[[[.6,0],[1.4,0],[2,.6],[2,3.4],[1.4,4],[.6,4],[0,3.4],[0,.6],[.6,0]]],
    p:[[[0,4],[0,0],[1.4,0],[2,.6],[2,1.5],[1.4,2.1],[0,2.1]]],
    q:[[[.6,0],[1.4,0],[2,.6],[2,3.4],[1.4,4],[.6,4],[0,3.4],[0,.6],[.6,0]],[[1.2,2.8],[2,4]]],
    r:[[[0,4],[0,0],[1.4,0],[2,.6],[2,1.5],[1.4,2.1],[0,2.1]],[[.9,2.1],[2,4]]],
    s:[[[2,.6],[1.4,0],[.6,0],[0,.6],[0,1.4],[.6,2],[1.4,2],[2,2.6],[2,3.4],[1.4,4],[.6,4],[0,3.4]]],
    t:[[[0,0],[2,0]],[[1,0],[1,4]]],
    u:[[[0,0],[0,3.4],[.6,4],[1.4,4],[2,3.4],[2,0]]],
    v:[[[0,0],[1,4],[2,0]]],
    w:[[[0,0],[.5,4],[1,1.5],[1.5,4],[2,0]]],
    x:[[[0,0],[2,4]],[[2,0],[0,4]]],
    y:[[[0,0],[1,2],[2,0]],[[1,2],[1,4]]],
    z:[[[0,0],[2,0],[0,4],[2,4]]],
    "/":[[[2,0],[0,4]]],
  };

  // ---- sites: letter -> subdomain info ----
  const SITES = {
    h: ["#55d6ff", "hb", "Hatena-style bookmarks. j/k to move, p/n to switch category."],
    q: ["#2f6bff", "quotes", "Quote collection under a starry sky."],
    v: ["#ff8a1f", "cb", "Life-log aggregation: statements and records in one place."],
    o: ["#ffe14a", "oneliner", "Copy-paste one-liners, ready to grab."],
    b: ["#ff4fa0", "calbu", "Calbu."],
    j: ["#d44fff", "jotd", "Quick notes for when you just need to scribble."],
    a: ["#ffffff", "ihcimen", "A memo diary with a date-stamped clock."],
    p: ["#ff3b3b", "pw", "Password generator."],
    s: ["#b8c4d8", "reqr", "URL sharing service."],
    c: ["#c98a4b", "quick", "Bookmark archive."],
    k: ["#e9e4cf", "qk", "Quote screensaver for e-paper devices."],
    "/": ["#00ff66", "search", "Search ~1,500 hosts. Press / anywhere. @tag filters, Esc closes."],
  };
  const OWNER_ONLY = new Set(["q", "c", "b", "k"]);
  const GREEN = [0, 1, .4];
  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);

  // ---- layout ----
  const rows = [
    [..."`1234567890-=".split("").map(c => [c, 1]), ["", 2]],
    [["", 1.5], ..."qwertyuiop[]".split("").map(c => [c, 1]), ["", 1.5]],
    [["", 1.75], ..."asdfghjkl;'".split("").map(c => [c, 1]), ["", 2.25]],
    [["", 2.25], ..."zxcvbnm,./".split("").map(c => [c, 1]), ["", 2.75]],
    [["", 1.25], ["", 1.25], ["", 1.25], ["", 6.25], ["", 1.25], ["", 1.25], ["", 1.25], ["", 1.25]],
  ];
  const totalW = 15 * U + PAD * 2, totalH = rows.length * U + PAD * 2;
  const keys = [];            // {x,y,w,h,label,idx}
  rows.forEach((row, ri) => {
    let x = PAD;
    row.forEach(([label, wu]) => {
      keys.push({ x: x + GAP / 2 - totalW / 2, y: PAD + ri * U + GAP / 2 - totalH / 2,
                  w: wu * U - GAP, h: U - GAP, label: /^[a-z\/]$/.test(label) ? label : "", idx: keys.length });
      x += wu * U;
    });
  });
  const BASE = keys.length;   // slot for the base slab
  const byLetter = {};
  keys.forEach(k => { if (k.label) byLetter[k.label] = k; });

  // ---- geometry: [x,y,z,keyIdx] ----
  const lines = [], tris = [];
  let CUR = GREEN;
  const L = (a, b, k) => lines.push(a[0], a[1], a[2], k, ...CUR, b[0], b[1], b[2], k, ...CUR);
  function box(x, y, w, h, z0, z1, k) {
    const c = z => [[x, y, z], [x + w, y, z], [x + w, y + h, z], [x, y + h, z]];
    const lo = c(z0), hi = c(z1);
    for (let i = 0; i < 4; i++) { L(lo[i], lo[(i + 1) % 4], k); L(hi[i], hi[(i + 1) % 4], k); L(lo[i], hi[i], k); }
    const t = (a, b, c2) => tris.push(...a, k, ...CUR, ...b, k, ...CUR, ...c2, k, ...CUR);
    t(hi[0], hi[1], hi[2]); t(hi[0], hi[2], hi[3]);
  }
  box(-totalW / 2, -totalH / 2, totalW, totalH, 0, BH, BASE);
  keys.forEach(k => {
    const site = SITES[k.label];
    CUR = site ? hex(site[0]) : GREEN;
    box(k.x, k.y, k.w, k.h, BH, BH + KH, k.idx);
    if (!k.label) return;
    if (!site) CUR = GREEN.map(v => v * .4);
    const s = 6.5, gx = k.x + k.w / 2 - s, gy = k.y + k.h / 2 - 2 * s, z = BH + KH + .3;
    F[k.label].forEach(st => {
      for (let i = 0; i < st.length - 1; i++)
        L([gx + st[i][0] * s, gy + st[i][1] * s, z], [gx + st[i + 1][0] * s, gy + st[i + 1][1] * s, z], k.idx + 1000);
    });
  });
  const lineData = new Float32Array(lines), triData = new Float32Array(tris);

  // ---- GL setup ----
  const VS = `
    attribute vec3 a_pos; attribute float a_key; attribute vec3 a_col;
    uniform float u_rx, u_rz, u_sc, u_tz, u_f; uniform vec2 u_pan, u_half;
    uniform vec2 u_st[80];
    varying float v_hl, v_lab; varying vec3 v_col;
    void main() {
      float lab = a_key >= 1000.0 ? 1.0 : 0.0;
      int k = int(a_key - lab * 1000.0 + 0.5);
      float dz = 0.0, hl = 0.0;
      for (int i = 0; i < 80; i++) if (i == k) { dz = u_st[i].x; hl = u_st[i].y; }
      vec3 p = a_pos; p.z += dz;
      float cz = cos(u_rz), sz = sin(u_rz), cx = cos(u_rx), sx = sin(u_rx);
      float x1 = p.x * cz - p.y * sz, y1 = p.x * sz + p.y * cz;
      float y2 = y1 * cx - p.z * sx, z2 = y1 * sx + p.z * cx;
      vec3 q = vec3(x1, y2, z2) * u_sc;
      q.z += u_tz; q.xy += u_pan;
      float w = u_f - q.z;
      gl_Position = vec4(q.x * u_f / u_half.x, -q.y * u_f / u_half.y, 0.0, w);
      v_hl = hl; v_lab = lab; v_col = a_col;
    }`;
  const FS_LINE = `
    precision mediump float; varying float v_hl, v_lab; varying vec3 v_col; uniform float u_a, u_glow;
    void main() {
      float a = (0.7 + 0.3 * v_lab + 0.3 * v_hl) * u_a;
      vec3 c = v_col;
      gl_FragColor = u_glow > 0.5 ? vec4(c * a, 1.0) : vec4(c, a);
    }`;
  const FS_FILL = `
    precision mediump float; varying float v_hl, v_lab; varying vec3 v_col; uniform float u_a;
    void main() { gl_FragColor = vec4(v_col, (0.035 + 0.4 * v_hl) * u_a); }`;
  const VS_Q = `attribute vec2 p; varying vec2 uv; void main(){ uv = p * .5 + .5; gl_Position = vec4(p, 0., 1.); }`;
  const FS_Q = `precision mediump float; varying vec2 uv; uniform sampler2D t; uniform float g;
    void main(){ gl_FragColor = vec4(texture2D(t, uv).rgb * g, 1.0); }`;
  function prog(vs, fs) {
    const mk = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); return o; };
    const p = gl.createProgram();
    gl.attachShader(p, mk(gl.VERTEX_SHADER, vs)); gl.attachShader(p, mk(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(p));
    const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) { const nm = gl.getActiveUniform(p, i).name.replace("[0]", ""); u[nm] = gl.getUniformLocation(p, nm + (nm.startsWith("u_st") ? "[0]" : "")); }
    return { p, u };
  }
  const pLine = prog(VS, FS_LINE), pFill = prog(VS, FS_FILL), pQuad = prog(VS_Q, FS_Q);
  const mkBuf = d => { const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, d, gl.STATIC_DRAW); return b; };
  const bLine = mkBuf(lineData), bTri = mkBuf(triData), bQuad = mkBuf(new Float32Array([-1,-1, 1,-1, -1,1, 1,1]));

  // glow target (low-res; linear upsampling = free blur)
  const GS = 3;
  const gTex = gl.createTexture(), gFbo = gl.createFramebuffer();
  let gw = 0, gh = 0;

  let W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    gw = Math.max(1, Math.round(canvas.width / GS)); gh = Math.max(1, Math.round(canvas.height / GS));
    gl.bindTexture(gl.TEXTURE_2D, gTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gw, gh, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.bindFramebuffer(gl.FRAMEBUFFER, gFbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, gTex, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    wake();
  }
  addEventListener("resize", resize);

  // ---- state ----
  const ease = t => 1 - Math.pow(1 - t, 4);
  const lerp = (a, b, t) => a + (b - a) * t;
  const start = performance.now() + 150, DUR = 2000;   // overlaps the typing
  let yaw = 0, pitch = 0, zoom = 1, panX = 0, panY = 0;
  let tyaw = 0, tpitch = 0, tzoom = 1, tpanX = 0, tpanY = 0;
  const st = new Float32Array(160);
  const dz = new Float32Array(80), tdz = new Float32Array(80), hl = new Float32Array(80), thl = new Float32Array(80);
  let cam = { rx: 0, rz: 0, sc: 1, tz: 0, f: 1500 };

  function updateCam(now) {
    const t = Math.max(0, Math.min(1, (now - start) / DUR)), k = ease(t);
    const fit = Math.min(1, W / (totalW + 80)) * Math.min(1, H / 560);
    const d = .12;
    yaw += (tyaw - yaw) * d; pitch += (tpitch - pitch) * d; zoom += (tzoom - zoom) * d;
    panX += (tpanX - panX) * d; panY += (tpanY - panY) * d;
    cam = { rx: (lerp(0, 30, k) + pitch) * Math.PI / 180, rz: (lerp(-70, -8, k) + yaw) * Math.PI / 180,
            sc: lerp(.35, 1, k) * fit * zoom, tz: lerp(-400, 0, k), f: lerp(260, 1500, k), a: Math.min(1, t * 3) };
    return t < 1;
  }
  function project(x, y, z) {
    const cz = Math.cos(cam.rz), sz = Math.sin(cam.rz), cx = Math.cos(cam.rx), sx = Math.sin(cam.rx);
    const x1 = x * cz - y * sz, y1 = x * sz + y * cz;
    const y2 = y1 * cx - z * sx, z2 = y1 * sx + z * cx;
    const X = x1 * cam.sc + panX, Y = y2 * cam.sc + panY, Z = z2 * cam.sc + cam.tz;
    const w = cam.f - Z;
    return [W / 2 + X * cam.f / w, H / 2 + Y * cam.f / w, w];
  }
  function pick(px, py) {
    let best = -1, bw = 1e9;
    for (const k of keys) {
      const z = BH + KH + dz[k.idx];
      const q = [[k.x, k.y], [k.x + k.w, k.y], [k.x + k.w, k.y + k.h], [k.x, k.y + k.h]].map(c => project(c[0], c[1], z));
      let pos = 0, neg = 0;
      for (let i = 0; i < 4; i++) {
        const a = q[i], b = q[(i + 1) % 4];
        const c = (b[0] - a[0]) * (py - a[1]) - (b[1] - a[1]) * (px - a[0]);
        if (c > 0) pos++; else neg++;
      }
      if (pos === 4 || neg === 4) { const w = (q[0][2] + q[2][2]) / 2; if (w < bw) { bw = w; best = k.idx; } }
    }
    return best;
  }

  // ---- draw ----
  function setCommon(P, glow, a) {
    gl.useProgram(P.p);
    gl.uniform1f(P.u.u_rx, cam.rx); gl.uniform1f(P.u.u_rz, cam.rz); gl.uniform1f(P.u.u_sc, cam.sc);
    gl.uniform1f(P.u.u_tz, cam.tz); gl.uniform1f(P.u.u_f, cam.f);
    gl.uniform2f(P.u.u_pan, panX, panY); gl.uniform2f(P.u.u_half, W / 2, H / 2);
    for (let i = 0; i < 80; i++) { st[i * 2] = dz[i]; st[i * 2 + 1] = hl[i]; }
    gl.uniform2fv(P.u.u_st, st);
    gl.uniform1f(P.u.u_a, a);
    if (P.u.u_glow) gl.uniform1f(P.u.u_glow, glow);
  }
  function attrs(P, buf) {
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    const lp = gl.getAttribLocation(P.p, "a_pos"), lk = gl.getAttribLocation(P.p, "a_key"), lc = gl.getAttribLocation(P.p, "a_col");
    gl.enableVertexAttribArray(lp); gl.enableVertexAttribArray(lk); gl.enableVertexAttribArray(lc);
    gl.vertexAttribPointer(lp, 3, gl.FLOAT, false, 28, 0);
    gl.vertexAttribPointer(lk, 1, gl.FLOAT, false, 28, 12);
    gl.vertexAttribPointer(lc, 3, gl.FLOAT, false, 28, 16);
  }
  // ---- weather sky (Open-Meteo, Tokyo): sun/moon on an arc, clouds, rain, snow, fog, lightning ----
  const PARAMS = new URLSearchParams(location.search);       // ?wx=rain|snow|clear|cloudy|fog|thunder  &at=21.5 (JST hour) for demos
  const WX_URL = "https://api.open-meteo.com/v1/forecast?latitude=35.6895&longitude=139.6917" +
    "&current=temperature_2m,weather_code,cloud_cover&daily=sunrise,sunset&timezone=Asia%2FTokyo&forecast_days=2";
  const clockOffset = PARAMS.has("at") ? (() => {
    const j = new Date(Date.now() + 9 * 3600e3), cur = j.getUTCHours() + j.getUTCMinutes() / 60;
    return ((+PARAMS.get("at") - cur) * 3600e3) || 0;
  })() : 0;
  const nowMs = () => Date.now() + clockOffset;
  const jst = s => Date.parse(s + ":00+09:00");
  function classify(code, cloudPct) {
    let kind = "clear", inten = 0, label = "CLEAR";
    if (code === 1) label = "MOSTLY CLEAR"; else if (code === 2) label = "PARTLY CLOUDY"; else if (code === 3) label = "OVERCAST";
    else if (code === 45 || code === 48) { kind = "fog"; label = "FOG"; }
    else if (code >= 51 && code <= 57) { kind = "rain"; inten = .25; label = "DRIZZLE"; }

    if (wx.kind === "rain" || wx.kind === "thunder") {

      while (rain.length < target) rain.push({ x: Math.random() * (W + 200) - 100, y: Math.random() * H, v: 700 + Math.random() * 500, l: 12 + Math.random() * 14 });
      rain.length = target;
      const slant = .18;
      for (const d of rain) {
        d.y += d.v * dt; d.x -= d.v * dt * slant;
        if (d.y > H + 30) { d.y = -30; d.x = Math.random() * (W + 200) - 100 + H * slant; }
        seg(d.x, d.y, d.x + d.l * slant, d.y - d.l, .45);
      }
    }
    // snow
    if (wx.kind === "snow") {
      const target = Math.round(40 + wx.inten * 90);
      while (snow.length < target) snow.push({ x: Math.random() * W, y: Math.random() * H, v: 50 + Math.random() * 70, ph: Math.random() * 6.28, z: 2 + Math.random() * 2.5 });
      snow.length = target;
      for (const f of snow) {
        f.y += f.v * dt; if (f.y > H + 10) { f.y = -10; f.x = Math.random() * W; }
        const x = f.x + Math.sin(t * .8 + f.ph) * 18, z = f.z;
        seg(x - z, f.y, x + z, f.y, .7); seg(x, f.y - z, x, f.y + z, .7); seg(x - z * .7, f.y - z * .7, x + z * .7, f.y + z * .7, .45); seg(x - z * .7, f.y + z * .7, x + z * .7, f.y - z * .7, .45);
      }
    }
    // lightning
    if (wx.kind === "thunder") {
      if (now > boltAt) {
        boltAt = now + 3500 + Math.random() * 5000;
        let x = W * (.2 + Math.random() * .6), y = H * .12; bolt = [[x, y]];
        while (y < H * .6) { x += (Math.random() - .5) * 60; y += 30 + Math.random() * 30; bolt.push([x, y]); }
        flash = 1;
      }
      if (flash > 0) { poly(bolt, Math.min(1, flash * 1.6), false); flash -= dt * 2.5; }
    }
    flush();
  }
  function drawSky(glow) {
    if (!skyN) return;
    gl.useProgram(pSky.p);
    gl.uniform2f(pSky.u.u_res, W, H); gl.uniform1f(pSky.u.u_glow, glow);
    gl.bindBuffer(gl.ARRAY_BUFFER, bSky);
    const l = gl.getAttribLocation(pSky.p, "s_p");
    gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, 3, gl.FLOAT, false, 12, 0);
    gl.drawArrays(gl.LINES, 0, skyN);
  }

  function draw(now) {
    buildSky(now);
    // glow pass (low res)
    gl.bindFramebuffer(gl.FRAMEBUFFER, gFbo);
    gl.viewport(0, 0, gw, gh);
    gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
    drawSky(1);
    setCommon(pLine, 1, cam.a); attrs(pLine, bLine);
    gl.drawArrays(gl.LINES, 0, lineData.length / 7);
    // main pass
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.blendFunc(gl.ONE, gl.ONE);
    gl.useProgram(pQuad.p);
    gl.bindBuffer(gl.ARRAY_BUFFER, bQuad);
    const lq = gl.getAttribLocation(pQuad.p, "p");
    gl.enableVertexAttribArray(lq); gl.vertexAttribPointer(lq, 2, gl.FLOAT, false, 0, 0);
    gl.bindTexture(gl.TEXTURE_2D, gTex); gl.uniform1i(pQuad.u.t, 0); gl.uniform1f(pQuad.u.g, 0.55);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    drawSky(0);
    setCommon(pFill, 0, cam.a); attrs(pFill, bTri);
    gl.drawArrays(gl.TRIANGLES, 0, triData.length / 7);
    setCommon(pLine, 0, cam.a); attrs(pLine, bLine);
    gl.drawArrays(gl.LINES, 0, lineData.length / 7);
  }

  let raf = 0, last = 0;
  function frame(now) {
    raf = 0;
    let active = updateCam(now);
    for (let i = 0; i < 80; i++) {
      dz[i] += (tdz[i] - dz[i]) * .35; hl[i] += (thl[i] - hl[i]) * .3;
      if (Math.abs(tdz[i] - dz[i]) > .02 || Math.abs(thl[i] - hl[i]) > .01) active = true;
    }
    if (Math.abs(tyaw - yaw) + Math.abs(tpitch - pitch) + Math.abs(tpanX - panX) + Math.abs(tpanY - panY) > .02 ||
        Math.abs(tzoom - zoom) > .0005) active = true;
    // weather keeps animating; throttle when nothing else moves
    const animated = true;
    if (active || now - last >= (animated ? 33 : 100)) { last = now; draw(now); }
    raf = requestAnimationFrame(frame);
  }
  function wake() { if (!raf) raf = requestAnimationFrame(frame); }

  // ---- input ----
  let moved = false, leaving = false, hover = -1, pinch = 0, downPos = null;
  const ptrs = new Map();
  let peekTimer = 0, peeked = false;
  const tip = document.getElementById("tip");
  let tipX = 0, tipY = 0;
  function showTip(i) {
    const site = i >= 0 && SITES[keys[i].label];
    if (!site) { tip.style.opacity = 0; return; }
    const ch = keys[i].label;
    tip.innerHTML = `<b style="color:${site[0]}">${ch === "/" ? "/ search" : ch + "." + DOMAIN}</b><br>${site[1]} — ${site[2]}` +
      (OWNER_ONLY.has(ch) ? `<br><b style="color:#ff8a1f">[ OWNER'S ONLY ]</b>` : "");
    tip.style.borderColor = site[0];
    tip.style.opacity = 1;
  }
  function moveTip(x, y, above) {      // above = touch: show over the fingertip so the finger doesn't cover it
    const w = tip.offsetWidth, h = tip.offsetHeight;
    const tx = above ? Math.max(8, Math.min(x - w / 2, W - w - 8)) : Math.min(x + 16, W - w - 8);
    const ty = above ? Math.max(8, y - h - 36) : Math.min(y + 18, H - h - 8);
    tip.style.transform = `translate(${tx}px, ${ty}px)`;
  }
  function setHover(i) {
    if (i === hover) return;
    if (hover >= 0) thl[hover] = 0;
    hover = i; if (i >= 0) thl[i] = 1;
    canvas.style.cursor = i >= 0 && SITES[keys[i].label] ? "pointer" : "grab";
    showTip(i);
    wake();
  }
  canvas.addEventListener("pointerdown", e => {
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    canvas.setPointerCapture(e.pointerId);
    moved = false; pinch = 0; downPos = [e.clientX, e.clientY];
    // touch: resting a finger on a key shows its description (release without moving = no navigation)
    clearTimeout(peekTimer); peeked = false;
    if (e.pointerType !== "mouse") peekTimer = setTimeout(() => {
      if (moved || ptrs.size !== 1) return;
      const i = pick(downPos[0], downPos[1]);
      if (i >= 0 && SITES[keys[i].label]) { peeked = true; setHover(i); moveTip(downPos[0], downPos[1], true); }
    }, 220);
  });
  canvas.addEventListener("pointermove", e => {
    const p = ptrs.get(e.pointerId);
    if (!p) { if (e.pointerType === "mouse") { setHover(pick(e.clientX, e.clientY)); moveTip(e.clientX, e.clientY); } return; }
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (ptrs.size >= 2) {
      const [a, b] = [...ptrs.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinch) tzoom = Math.min(3, Math.max(.4, tzoom * d / pinch));
      pinch = d; tpanX += dx / 2; tpanY += dy / 2; moved = true;
    } else if (e.shiftKey || e.buttons & 2) {
      tpanX += dx; tpanY += dy; moved = true;
    } else {
      if (Math.hypot(e.clientX - downPos[0], e.clientY - downPos[1]) > 6) moved = true;
      tyaw += dx * .35; tpitch = Math.max(-50, Math.min(35, tpitch - dy * .25));
    }
    if (moved && peeked) { peeked = false; setHover(-1); }
    wake();
  });
  const end = e => {
    const wasSingle = ptrs.size === 1;
    ptrs.delete(e.pointerId); pinch = 0;
    clearTimeout(peekTimer);
    if (peeked) { peeked = false; setHover(-1); return; }
    if (e.type === "pointerup" && wasSingle && !moved) {
      const i = pick(e.clientX, e.clientY);
      if (i >= 0 && SITES[keys[i].label]) go(keys[i].label);
    }
  };
  canvas.addEventListener("pointerup", end);
  canvas.addEventListener("pointercancel", end);
  canvas.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") setHover(-1); });
  canvas.addEventListener("contextmenu", e => e.preventDefault());
  canvas.addEventListener("wheel", e => {
    e.preventDefault();
    tzoom = Math.min(3, Math.max(.4, tzoom * Math.exp(-e.deltaY * .001))); wake();
  }, { passive: false });
  addEventListener("dblclick", () => { tyaw = tpitch = tpanX = tpanY = 0; tzoom = 1; wake(); });

  function go(ch) {
    if (ch === "/") { openSearch(); return; }
    if (leaving || !SITES[ch]) return;
    leaving = true;
    tdz[byLetter[ch].idx] = -14; thl[byLetter[ch].idx] = 1; wake();
    setTimeout(() => { location.href = `https://${ch}.${DOMAIN}`; }, 220);
  }
  addEventListener("keydown", e => {
    if (searchOpen || e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
    if (e.key === "/") { e.preventDefault(); openSearch(); return; }
    if (/^[a-zA-Z]$/.test(e.key)) { e.preventDefault(); go(e.key.toLowerCase()); }
  });
  addEventListener("pageshow", () => { leaving = false; tdz.fill(0); thl.fill(0); hover = -1; wake(); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) wake(); });

  // ---- terminal readout: typed one char at a time, then a live clock ----
  const term = document.getElementById("term");
  const p2 = n => String(n).padStart(2, "0");
  const lineFns = [
    () => "poet.blue homepage",
    () => { const d = new Date(); return `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())} ${["SUNDAY","MONDAY","TUESDAY","WEDNESDAY","THURSDAY","FRIDAY","SATURDAY"][d.getDay()]}`; },
    () => { const d = new Date(); return `${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`; },
  ];
  const lineEls = lineFns.map(() => { const d = document.createElement("div"); term.appendChild(d); return d; });
  const cursor = document.createElement("i");
  (async () => {
    for (let i = 0; i < lineFns.length; i++) {
      const text = lineFns[i](), node = document.createTextNode("");
      lineEls[i].append(node, cursor);
      for (const ch of text) {
        node.data += ch;
        await new Promise(r => setTimeout(r, 45 + Math.random() * 60));
      }
      lineEls[i].textNode = node;
      await new Promise(r => setTimeout(r, 180));
    }
    setInterval(() => { lineEls.forEach((el, i) => { if (i && i < lineFns.length) el.textNode.data = lineFns[i](); }); }, 1000);
    await Promise.race([wxReady, new Promise(r => setTimeout(r, 4000))]);
    if (wx) {
      const extra = [`TOKYO ${wx.temp.toFixed(1)}C ${wx.label}`, `SUNRISE ${wx.riseS}  SUNSET ${wx.setS}`];
      for (const text of extra) {
        const d = document.createElement("div"), node = document.createTextNode("");
        term.appendChild(d); d.append(node, cursor);
        for (const ch of text) { node.data += ch; await new Promise(r => setTimeout(r, 30 + Math.random() * 40)); }
      }
    }
    cursor.remove();
  })();

  // ---- calendar countdown + progress bars (local time, week starts Monday) ----
  const cal = document.getElementById("cal");
  const DAY = 864e5;
  function calTick() {
    const n = new Date(), y = n.getFullYear(), m = n.getMonth();
    const d0 = new Date(y, m, n.getDate()), dow = (n.getDay() + 6) % 7;
    const span = (a, b) => (n - a) / (b - a);
    const nextM = new Date(y, m + 1, 1), nextY = new Date(y + 1, 0, 1);
    const bars = [
      ["DAY", span(d0, new Date(y, m, n.getDate() + 1))],
      ["WEEK", span(new Date(y, m, n.getDate() - dow), new Date(y, m, n.getDate() - dow + 7))],
      ["MONTH", span(new Date(y, m, 1), nextM)],
      ["YEAR", span(new Date(y, 0, 1), nextY)],
    ];
    const left = t => Math.round((t - d0) / DAY);
    cal.innerHTML =
      `<div class="row"><span>NEXT MONTH</span><span>${left(nextM)} DAYS</span></div>` +
      `<div class="row"><span>NEXT YEAR</span><span>${left(nextY)} DAYS</span></div><div class="gap"></div>` +
      bars.map(([k, f]) => `<div class="row"><span>${k}</span><span>${(f * 100).toFixed(3)}%</span></div><div class="bar"><i style="width:${(f * 100).toFixed(2)}%"></i></div>`).join("");
  }
  calTick(); setInterval(calTick, 500);
  setTimeout(() => cal.classList.add("on"), 1200);

  // ---- USD/JPY: latest rate + 30-day sparkline (Frankfurter = ECB daily reference rates; not real time) ----
  const fx = document.getElementById("fx");
  function fxRender(series) {      // series: [[date, rate], ...] oldest -> newest
    if (!series || series.length < 2) return;
    const pts = series.slice(-30), last = pts[pts.length - 1], prev = pts[pts.length - 2];
    const lo = Math.min(...pts.map(p => p[1])), hi = Math.max(...pts.map(p => p[1])), span = hi - lo || 1;
    const X = i => (i / (pts.length - 1)) * 170, Y = v => 42 - ((v - lo) / span) * 38;
    const line = pts.map((p, i) => `${X(i).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(" ");
    const d = last[1] - prev[1], pct = d / prev[1] * 100, down = d < 0;
    fx.innerHTML =
      `<div class="dim">USD/JPY ${last[0].slice(5)}${[0, 6].includes(new Date(Date.now() + 9 * 36e5).getUTCDay()) ? " CLOSED" : ""}</div>` +
      `<div class="big">¥${last[1].toFixed(2)}</div>` +
      `<div class="${down ? "dn" : ""}">${down ? "▼" : "▲"} ${Math.abs(d).toFixed(2)} (${Math.abs(pct).toFixed(2)}%)</div>` +
      `<svg viewBox="0 0 170 46" preserveAspectRatio="none"><polygon points="0,46 ${line} 170,46" fill="rgba(0,255,102,.12)"/>` +
      `<polyline points="${line}" fill="none" stroke="#00ff66" stroke-width="1.5" vector-effect="non-scaling-stroke"/>` +
      `<circle cx="170" cy="${Y(last[1]).toFixed(1)}" r="2.5" fill="#00ff66"/></svg>` +
      `<div class="dim">${pts.length}D ${lo.toFixed(1)}-${hi.toFixed(1)}</div>`;
    fx.classList.add("on");
  }
  async function fxLoad() {
    try { const c = JSON.parse(localStorage.getItem("fx") || "null"); if (c) fxRender(c); } catch {}
    try {
      let series;
      if (PARAMS.get("fx") === "demo") {
        let v = 150; series = Array.from({ length: 30 }, (_, i) => [`2026-10-${String(i % 28 + 1).padStart(2, "0")}`, (v += Math.sin(i * 1.3) * .8 + .15)]);
      } else {
        const iso = t => new Date(t).toISOString().slice(0, 10), now = Date.now();
        const r = await fetch(`https://api.frankfurter.dev/v1/${iso(now - 50 * 864e5)}..${iso(now)}?base=USD&symbols=JPY`);
        if (!r.ok) throw 0;
        const j = await r.json();
        series = Object.keys(j.rates).sort().map(k => [k, j.rates[k].JPY]).filter(p => isFinite(p[1]));
      }
      if (series.length < 2) throw 0;
      fxRender(series);
      try { localStorage.setItem("fx", JSON.stringify(series)); } catch {}
    } catch {}
  }
  fxLoad(); setInterval(fxLoad, 30 * 60e3);

  // ---- host search (ported from gojiroma/go): "/" opens, one match opens the site ----
  const sEl = document.getElementById("search"), sq = document.getElementById("sq"),
        sList = document.getElementById("slist"), sMeta = document.getElementById("smeta");
  let searchOpen = false, hosts = null, sugs = [], tagCount = null, shown = [], act = 0, lastOpened = "", loading = null;
  const esc = t => t.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const hiName = (name, t) => { if (!t) return esc(name); const i = name.toLowerCase().indexOf(t);
    return i < 0 ? esc(name) : esc(name.slice(0, i)) + "<mark>" + esc(name.slice(i, i + t.length)) + "</mark>" + esc(name.slice(i + t.length)); };
  function loadHosts() {
    if (hosts) return Promise.resolve();
    return loading || (loading = new Promise(res => {
      const sc = document.createElement("script");
      sc.src = "hosts.js"; sc.onload = () => { hosts = window.GO_HOSTS; res(); };
      sc.onerror = () => { loading = null; sMeta.textContent = "failed to load hosts"; res(); };
      document.head.appendChild(sc);
    }));
  }
  function sRender() {
    if (!hosts) { sList.innerHTML = ""; sMeta.textContent = "loading..."; return; }
    if (!tagCount) { tagCount = {}; hosts.forEach(h => h.tags.forEach(t => { tagCount[t] = (tagCount[t] || 0) + 1; })); }
    const v = sq.value, m = /(?:^|\s)@([^\s@]*)$/.exec(v);   // last token is a half-typed @tag
    sugs = [];
    if (m) {
      const part = m[1].toLowerCase();
      const hit = Object.keys(tagCount).filter(t => t.startsWith(part)).sort((a, b) => tagCount[b] - tagCount[a] || a.localeCompare(b));
      if (!(hit.length === 1 && hit[0] === part)) sugs = hit;
    }
    if (sugs.length) {
      act = Math.min(act, sugs.length - 1);
      sList.innerHTML = sugs.map((t, i) => `<div data-tag="${esc(t)}" class="${i === act ? "active" : ""}"><span>@${esc(t)}</span><span class="tags">${tagCount[t]}</span></div>`).join("");
      sMeta.textContent = `${sugs.length} tags — Tab / Enter to pick`;
      shown = [];
      const el0 = sList.children[act]; if (el0 && el0.scrollIntoView) el0.scrollIntoView({ block: "nearest" });
      return;
    }
    const words = sq.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const t = words.filter(w => w[0] !== "@").join(" ");
    const tagHit = (h, g) => h.tags.some(x => x.startsWith(g));
    shown = hosts.filter(h => words.every(w => w[0] === "@" ? tagHit(h, w.slice(1)) : (h.key.includes(w) || tagHit(h, w))));
    act = Math.min(act, Math.max(0, shown.length - 1));
    const LIM = 40;
    sList.innerHTML = shown.slice(0, LIM).map((h, i) =>
      `<a href="${esc(h.to)}" target="_blank" rel="noopener" data-i="${i}" class="${i === act ? "active" : ""}"><span>${hiName(h.name, t)}</span>` +
      (h.tags.length ? `<span class="tags">${h.tags.map(x => "@" + x).join(" ")}</span>` : "") + "</a>").join("");
    sMeta.textContent = shown.length > LIM ? `${LIM} / ${shown.length}` : `${shown.length} / ${hosts.length}`;
    const el = sList.children[act]; if (el && el.scrollIntoView) el.scrollIntoView({ block: "nearest" });
  }
  function openHost(h) {
    let w = null; try { w = window.open(h.to, "_blank"); } catch {}
    if (w) { try { w.opener = null; } catch {} lastOpened = h.host; sq.value = ""; act = 0; sRender(); }
  }
  function openSearch() {
    if (searchOpen) return;
    searchOpen = true; sEl.classList.add("on"); sq.value = ""; act = 0; sMeta.textContent = "loading...";
    sq.focus();
    loadHosts().then(sRender);
  }
  function closeSearch() { searchOpen = false; sEl.classList.remove("on"); sq.blur(); }
  sq.addEventListener("input", () => {
    act = 0; sRender();
    const t = sq.value.trim();
    if (t && !sugs.length && shown.length === 1 && lastOpened !== shown[0].host + "|" + t) { lastOpened = shown[0].host + "|" + t; openHost(shown[0]); }
  });
  sq.addEventListener("keydown", e => {
    if (e.key === "ArrowDown") { e.preventDefault(); act = Math.min(act + 1, (sugs.length || Math.min(shown.length, 40)) - 1); sRender(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); act = Math.max(act - 1, 0); sRender(); }
    else if ((e.key === "Tab" || e.key === "Enter") && sugs.length && !e.isComposing) { e.preventDefault(); pickTag(sugs[act]); }
    else if (e.key === "Enter" && !e.isComposing) {
      e.preventDefault();
      if (/[\u3040-\u30ff\u3400-\u9fff\uff66-\uff9f]/.test(sq.value)) location.assign("https://www.google.com/search?btnI=1&q=" + encodeURIComponent(sq.value.trim()));
      else if (shown[act]) openHost(shown[act]);
    }
    else if (e.key === "Escape") { if (sq.value) { sq.value = ""; sRender(); } else closeSearch(); }
  });
  function pickTag(t) { sq.value = sq.value.replace(/@[^\s@]*$/, "@" + t + " "); act = 0; sRender(); sq.focus(); }
  sList.addEventListener("click", e => {
    const d = e.target.closest("[data-tag]");
    if (d) { pickTag(d.dataset.tag); return; } if (e.target.closest("a")) setTimeout(() => { sq.value = ""; sRender(); sq.focus(); }, 0); });
  sEl.addEventListener("pointerdown", e => { if (e.target === sEl) closeSearch(); });

  resize();
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
