<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>poet.blue keyboard</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root { --g: #00ff66; --u: 56px; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    perspective: 4000px;
    touch-action: none; cursor: grab;
  }
  #board {
    position: relative;
    transform-style: preserve-3d;
    will-change: transform;
  }
  .box { position: absolute; transform-style: preserve-3d; }
  .face {
    position: absolute; left: 0; top: 0;
    box-sizing: border-box;
    border: 1px solid var(--g);
    background: rgba(0, 255, 102, .02);
    backface-visibility: visible;
    filter: drop-shadow(0 0 3px rgba(0, 255, 102, .6));
    display: flex; align-items: center; justify-content: center;
    color: var(--g);
    font: 600 calc(var(--u) * .36) / 1 "SF Mono", Menlo, Consolas, monospace;
    text-transform: uppercase;
    user-select: none;
  }
  .key { cursor: pointer; transition: transform .12s ease-out; }
  .key .top { transition: background .12s, box-shadow .12s; }
  .key:hover .top { background: rgba(0, 255, 102, .14); }
  .key.down { transform: translateZ(-14px); }
  .key.down .face { background: rgba(0, 255, 102, .35); }
  .base .face { border-color: rgba(0, 255, 102, .55); }
  #hint {
    position: fixed; bottom: 14px; width: 100%; text-align: center;
    color: rgba(0, 255, 102, .45); font: 12px monospace; letter-spacing: .2em;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="stage"><div id="board"></div></div>
<div id="hint">PRESS ANY LETTER &rarr; X.POET.BLUE · DRAG TO ORBIT</div>

<script>
(() => {
  const U = 56, H = 22, GAP = 4, DOMAIN = "poet.blue";
  const board = document.getElementById("board");
  const stage = document.getElementById("stage");

  // [label, width in units]; single letters are active
  const rows = [
    [..."`1234567890-=".split("").map(c => [c, 1]), ["", 2]],
    [["", 1.5], ..."qwertyuiop[]".split("").map(c => [c, 1]), ["", 1.5]],
    [["", 1.75], ..."asdfghjkl;'".split("").map(c => [c, 1]), ["", 2.25]],
    [["", 2.25], ..."zxcvbnm,./".split("").map(c => [c, 1]), ["", 2.75]],
    [["", 1.25], ["", 1.25], ["", 1.25], ["", 6.25], ["", 1.25], ["", 1.25], ["", 1.25], ["", 1.25]],
  ];
  const PAD = 14;
  const totalW = 15 * U + PAD * 2;
  const totalH = rows.length * U + PAD * 2;
  board.style.width = totalW + "px";
  board.style.height = totalH + "px";

  function face(parent, cls, w, h, tf, label) {
    const f = document.createElement("div");
    f.className = "face " + cls;
    f.style.width = w + "px";
    f.style.height = h + "px";
    f.style.transform = tf;
    if (label) f.textContent = label;
    parent.appendChild(f);
    return f;
  }

  function makeKey(x, y, w, h, d, label) {
    const b = document.createElement("div");
    b.className = "box";
    b.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px;`;
    face(b, "top", w, h, `translateZ(${d}px)`, label);
    // front (bottom edge in screen) / back (top edge)
    const fr = face(b, "side", w, d, `translateY(${h - d / 2}px) translateZ(${d / 2}px) rotateX(-90deg)`);
    const bk = face(b, "side", w, d, `translateY(${-d / 2}px) translateZ(${d / 2}px) rotateX(-90deg)`);
    // left / right
    const lf = face(b, "side", d, h, `translateX(${-d / 2}px) translateZ(${d / 2}px) rotateY(-90deg)`);
    const rt = face(b, "side", d, h, `translateX(${w - d / 2}px) translateZ(${d / 2}px) rotateY(-90deg)`);
    return b;
  }

  // base slab
  const base = makeKey(0, 0, totalW, totalH, 8, "");
  base.classList.add("base");
  board.appendChild(base);

  const keyEls = {};
  rows.forEach((row, ri) => {
    let x = PAD;
    row.forEach(([label, wu]) => {
      const w = wu * U - GAP;
      const el = makeKey(x + GAP / 2, PAD + ri * U + GAP / 2, w, U - GAP, H, /^[a-z]$/.test(label) ? label : "");
      el.classList.add("key");
      el.style.transform = "translateZ(8px)";
      if (/^[a-z]$/.test(label)) {
        el.dataset.k = label;
        keyEls[label] = el;
        el.addEventListener("click", () => { if (!moved) go(label); });
      }
      board.appendChild(el);
      x += wu * U;
    });
  });

  // keys live above base; .down overrides transform
  const style = document.createElement("style");
  style.textContent = `.key{transform:translateZ(8px)} .key.down{transform:translateZ(-6px)}`;
  document.head.appendChild(style);

  let leaving = false;
  function go(ch) {
    if (leaving) return;
    leaving = true;
    const el = keyEls[ch];
    if (el) el.classList.add("down");
    setTimeout(() => { location.href = `https://${ch}.${DOMAIN}`; }, 220);
  }
  addEventListener("keydown", e => {
    if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
    if (/^[a-zA-Z]$/.test(e.key)) { e.preventDefault(); go(e.key.toLowerCase()); }
  });
  addEventListener("pageshow", () => {
    leaving = false;
    Object.values(keyEls).forEach(el => el.classList.remove("down"));
  });

  // ---- camera: intro perspective shift, then mouse parallax ----
  const ease = t => 1 - Math.pow(1 - t, 4);
  const lerp = (a, b, t) => a + (b - a) * t;
  const start = performance.now(), DUR = 3200;
  // drag / swipe = orbit, wheel / pinch = zoom, shift-drag or two-finger = pan
  let yaw = 0, pitch = 0, zoom = 1, panX = 0, panY = 0;
  let tyaw = 0, tpitch = 0, tzoom = 1, tpanX = 0, tpanY = 0;
  let moved = false;
  const ptrs = new Map();
  let pinch = 0;
  stage.addEventListener("pointerdown", e => {
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    stage.setPointerCapture(e.pointerId);
    moved = false; pinch = 0;
  });
  stage.addEventListener("pointermove", e => {
    const p = ptrs.get(e.pointerId);
    if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (ptrs.size >= 2) {
      const [a, b] = [...ptrs.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinch) tzoom = Math.min(3, Math.max(.4, tzoom * d / pinch));
      pinch = d;
      tpanX += dx / 2; tpanY += dy / 2;
      moved = true;
    } else if (e.shiftKey || e.buttons & 2) {
      tpanX += dx; tpanY += dy; moved = true;
    } else {
      if (Math.abs(dx) + Math.abs(dy) > 0) moved = moved || Math.hypot(dx, dy) > 2;
      tyaw += dx * .35; tpitch -= dy * .25;
      tpitch = Math.max(-50, Math.min(35, tpitch));
    }
  });
  const up = e => { ptrs.delete(e.pointerId); pinch = 0; setTimeout(() => { if (!ptrs.size) moved = false; }, 0); };
  stage.addEventListener("pointerup", up);
  stage.addEventListener("pointercancel", up);
  stage.addEventListener("contextmenu", e => e.preventDefault());
  stage.addEventListener("wheel", e => {
    e.preventDefault();
    tzoom = Math.min(3, Math.max(.4, tzoom * Math.exp(-e.deltaY * .001)));
  }, { passive: false });
  addEventListener("dblclick", () => { tyaw = tpitch = tpanX = tpanY = 0; tzoom = 1; });

  function frame(now) {
    const t = Math.min(1, (now - start) / DUR), k = ease(t);
    const fit = Math.min(1, innerWidth / (totalW + 80)) * Math.min(1, innerHeight / 560);
    const f = .12;
    yaw += (tyaw - yaw) * f; pitch += (tpitch - pitch) * f; zoom += (tzoom - zoom) * f;
    panX += (tpanX - panX) * f; panY += (tpanY - panY) * f;
    const rx = lerp(0, 52, k) + pitch;
    const rz = lerp(-70, -14, k) + yaw;
    const sc = lerp(.35, 1, k) * fit * zoom;
    const persp = lerp(260, 1500, k);       // strong wide-angle distortion relaxing into a calm view
    stage.style.perspective = persp + "px";
    board.style.opacity = Math.min(1, t * 3);
    board.style.transform =
      `translate(${panX}px, ${panY}px) translateZ(${lerp(-400, 0, k)}px) scale(${sc}) rotateX(${rx}deg) rotateZ(${rz}deg)`;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
